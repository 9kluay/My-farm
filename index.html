<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K sarakharm farm EA : Ultimate Ecosystem Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050907;
            --glass-bg: rgba(14, 22, 19, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
            
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-emerald: #10b981;
            --accent-gold: #fbbf24;
            --accent-rose: #f43f5e;
            
            --card-radius: 16px;
            --btn-radius: 10px;
            --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 5%, rgba(16, 185, 129, 0.07) 0%, transparent 45%),
                radial-gradient(circle at 90% 95%, rgba(251, 191, 36, 0.04) 0%, transparent 45%);
            color: var(--text-main);
            margin: 0; padding: 15px 12px 100px 12px;
            min-height: 100vh; overflow-x: hidden;
            position: relative;
        }

        /* แถบแจ้งเตือนชั่วคราวกรณีเบราว์เซอร์บล็อก Autoplay (หายไปทันทีเมื่อแตะหน้าจอ) */
        .sound-unlock-toast {
            position: fixed;
            bottom: 38px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(14, 28, 22, 0.92);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #a7f3d0;
            font-size: 11px;
            padding: 6px 14px;
            border-radius: 20px;
            z-index: 1000;
            pointer-events: none;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
            transition: opacity 0.5s ease, transform 0.5s ease;
            white-space: nowrap;
        }
        .sound-unlock-toast.hidden {
            opacity: 0;
            transform: translate(-50%, 10px);
        }

        /* ละอองดอกไม้/ใบไม้ (โหมดกลางวัน - ขนาดเล็กกว่าครึ่งหนึ่งของต้นไม้) */
        .weather-particle {
            position: fixed; top: -50px; z-index: 1; pointer-events: none; user-select: none;
            opacity: 0.7; animation-timing-function: linear; animation-iteration-count: infinite;
        }
        @keyframes fallParticle {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
            20% { opacity: 0.85; }
            80% { opacity: 0.85; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        /* หิ่งห้อย (โหมดกลางคืน) */
        .firefly {
            position: fixed; border-radius: 50%;
            background-color: #d9f99d; 
            box-shadow: 0 0 6px 2px rgba(163, 230, 53, 0.8), 0 0 12px 4px rgba(190, 242, 100, 0.5);
            pointer-events: none; user-select: none; opacity: 0;
            animation: fireflyBlink ease-in-out infinite alternate, fireflyDrift linear infinite;
        }
        @keyframes fireflyBlink {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.9; transform: scale(1.2); }
        }
        @keyframes fireflyDrift {
            0% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -40px) rotate(15deg); }
            66% { transform: translate(-20px, -80px) rotate(-10deg); }
            100% { transform: translate(10px, -120px) rotate(5deg); }
        }

        .river-container {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 30px;
            background: rgba(3, 10, 7, 0.95); backdrop-filter: blur(10px);
            border-top: 1px solid var(--glass-border); z-index: 99;
            display: flex; align-items: center; overflow: hidden;
        }
        .river-wave-track { display: flex; white-space: nowrap; animation: flowRiver 50s linear infinite; }
        .river-wave-item { font-size: 11px; color: rgba(148, 163, 184, 0.7); padding-right: 50px; display: inline-flex; align-items: center; gap: 8px; }
        @keyframes flowRiver { 0% { transform: translate3d(0,0,0); } 100% { transform: translate3d(-50%,0,0); } }

        .container { max-width: 1200px; margin: 0 auto; position: relative; z-index: 10; animation: fadeIn 0.5s var(--ease-smooth) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* ส่วนหัวด้านบน */
        .top-nav { display: flex; justify-content: center; align-items: center; margin-bottom: 15px; width: 100%; }
        .nav-badges { display: flex; gap: 4px; align-items: center; justify-content: center; flex-wrap: nowrap; width: 100%; max-width: 100%; padding: 0 2px; }
        .badge { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border); padding: 4px 6px; border-radius: 14px; font-size: 9px; color: var(--text-muted); backdrop-filter: blur(10px); white-space: nowrap; flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; }
        .status-badge { background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.2); padding: 4px 6px; border-radius: 14px; font-size: 9px; font-weight: 600; color: var(--accent-emerald); display: flex; align-items: center; justify-content: center; gap: 3px; white-space: nowrap; flex: 1.1; text-align: center; }
        .status-dot-pulse { width: 5px; height: 5px; background-color: var(--accent-emerald); border-radius: 50%; box-shadow: 0 0 6px var(--accent-emerald); animation: pulse 2s infinite; flex-shrink: 0; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }
        .sync-spin { display: inline-block; font-size: 11px; animation: spinSync 1s linear infinite; }
        .sync-glow { text-shadow: 0 0 6px var(--accent-emerald); filter: drop-shadow(0 0 4px var(--accent-emerald)); }
        @keyframes spinSync { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        header { text-align: center; margin-bottom: 16px; }
        
        h1 { 
            font-size: clamp(30px, 7.5vw, 46px); font-weight: 800; letter-spacing: -0.5px; 
            margin: 0 0 8px 0; width: 100%; text-align: center;
            background: linear-gradient(135deg, #ffffff 15%, #34d399 75%, #fbbf24 100%); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            filter: drop-shadow(0 3px 12px rgba(16, 185, 129, 0.4));
        }
        
        /* สวนป่าด้านบน */
        .farm-eco-header-box {
            position: relative; background: transparent; border: none; border-radius: 0; 
            padding: 8px 0; width: 100%; margin: 0 auto 16px auto; overflow: hidden; 
        }
        .farm-eco-line { 
            position: relative; display: flex; justify-content: center; align-items: flex-end; 
            width: 100%; opacity: 0.95; flex-wrap: wrap; min-height: 46px;
        }
        
        .farm-eco-line span.forest-tree { 
            position: relative; display: inline-block; transition: transform 0.3s; 
            filter: drop-shadow(0 0 3px rgba(16, 185, 129, 0.15));
            margin: 0 -6px; z-index: 2; line-height: 1;
        }
        
        .farm-eco-line span.forest-tree.glowing {
            z-index: 10; 
            filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.9)) drop-shadow(0 0 16px rgba(251, 191, 36, 0.7));
            animation: treeGlow 3s ease-in-out infinite alternate;
        }
        @keyframes treeGlow {
            0% { filter: drop-shadow(0 0 4px rgba(16, 185, 129, 0.6)); transform: scale(1); }
            100% { filter: drop-shadow(0 0 14px rgba(251, 191, 36, 1)); transform: scale(1.08); }
        }

        /* กล่อง Dashboard หลัก */
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: var(--card-radius); padding: 18px; margin-bottom: 16px; box-shadow: var(--glass-shadow); }
        .main-stats-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 16px; }
        @media (max-width: 1100px) { .main-stats-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 650px) { .main-stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; } }
        .stat-box { background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.03); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; justify-content: center; transition: transform 0.2s, border-color 0.2s; }
        .stat-box:hover { border-color: rgba(16, 185, 129, 0.25); transform: translateY(-1px); }
        .stat-label { font-size: 9px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stat-value { font-size: 18px; font-weight: 600; color: var(--text-main); line-height: 1.2; letter-spacing: -0.3px; }
        .divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent); margin: 16px 0; }
        .history-stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
        .history-box { background: rgba(0, 0, 0, 0.18); border: 1px solid rgba(255, 255, 255, 0.03); border-radius: 8px; padding: 8px 4px; text-align: center; }
        .history-label { font-size: 8px; font-weight: 600; color: var(--text-muted); margin-bottom: 2px; text-transform: uppercase; }
        .history-value { font-size: 11px; font-weight: 600; }
        .positive { color: var(--accent-emerald) !important; } .negative { color: var(--accent-rose) !important; }

        /* แถบเครื่องมือ */
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: nowrap; gap: 6px; width: 100%; }
        .toolbar-left { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; width: 100%; }
        .toolbar-right { display: flex; align-items: center; flex-shrink: 0; }
        
        .btn-delete-all { 
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border); 
            color: rgba(255, 255, 255, 0.5); width: 34px; height: 34px; border-radius: var(--btn-radius); 
            font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; 
            backdrop-filter: blur(10px); transition: all 0.2s ease; flex-shrink: 0;
        }
        .btn-delete-all:hover { background: rgba(244, 63, 94, 0.12); border-color: rgba(244, 63, 94, 0.35); color: var(--accent-rose); }

        .search-box { 
            background: rgba(14, 22, 19, 0.7); border: 1px solid var(--glass-border); 
            border-radius: var(--btn-radius); padding: 6px 10px; flex: 1; min-width: 0; 
            display: flex; align-items: center; gap: 6px; backdrop-filter: blur(10px); height: 34px;
        }
        .search-input { background: transparent; border: none; color: var(--text-main); font-size: 11px; font-family: inherit; width: 100%; outline: none; }
        
        .sort-select {
            background: rgba(14, 22, 19, 0.7); border: 1px solid var(--glass-border);
            border-radius: var(--btn-radius); padding: 0 8px; color: var(--text-main);
            font-size: 11px; font-family: inherit; outline: none; cursor: pointer;
            backdrop-filter: blur(10px); height: 34px; flex: 1; min-width: 0; text-overflow: ellipsis;
        }
        .sort-select option { background: var(--bg-dark); color: var(--text-main); }

        #forest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
        .tree-card { background: var(--glass-bg); backdrop-filter: blur(14px); border: 1px solid var(--glass-border); border-radius: var(--card-radius); padding: 16px; display: flex; flex-direction: column; transition: transform 0.2s var(--ease-smooth), box-shadow 0.2s var(--ease-smooth), border-color 0.2s; box-shadow: 0 6px 20px rgba(0,0,0,0.25); position: relative; }
        .tree-card:hover { transform: translateY(-3px); border-color: rgba(16, 185, 129, 0.3); box-shadow: 0 10px 25px rgba(0,0,0,0.4); z-index: 10; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .plot-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; color: var(--text-main); }
        .currency-badge { background: rgba(251, 191, 36, 0.12); color: var(--accent-gold); font-size: 9px; padding: 2px 6px; border-radius: 5px; border: 1px solid rgba(251, 191, 36, 0.25); font-weight: 600; }
        .stars { color: var(--accent-gold); font-size: 11px; }
        .btn-delete { background: transparent; border: none; color: rgba(255,255,255,0.25); font-size: 14px; cursor: pointer; padding: 2px; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
        .btn-delete:hover { color: var(--accent-rose); background: rgba(244, 63, 94, 0.1); }
        .showcase { position: relative; height: 130px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 12px; background: radial-gradient(circle at center, rgba(255,255,255,0.02) 0%, transparent 70%); border-radius: 12px; border: 1px solid rgba(255,255,255,0.03); overflow: hidden; padding-bottom: 6px; }
        .showcase.danger-zone { background: radial-gradient(circle at center, rgba(244, 63, 94, 0.1) 0%, transparent 70%) !important; border-color: rgba(244, 63, 94, 0.25) !important; }
        .weather-pill { position: absolute; top: 8px; right: 8px; font-size: 9px; font-weight: 500; background: rgba(0,0,0,0.45); padding: 2px 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 3px; z-index: 10; backdrop-filter: blur(6px); }
        .forest-cluster { position: relative; display: flex; justify-content: center; align-items: flex-end; height: 80px; width: 100%; margin-top: 6px; padding: 0 4px; }
        .terrain-base { position: absolute; bottom: 2px; width: 100%; text-align: center; font-size: 9px; z-index: 1; opacity: 0.75; letter-spacing: 3px; user-select: none; pointer-events: none; }
        .tree-extra { position: absolute; z-index: 5; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.6)); line-height: 1; animation: floatTree 4s ease-in-out infinite; }
        @keyframes floatTree { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
        .tree-extra.withered { filter: grayscale(1) brightness(0.45) drop-shadow(0 2px 4px rgba(0,0,0,0.5)); animation: none !important; }
        .level-badge { margin-top: 2px; font-size: 9px; font-weight: 500; color: var(--accent-gold); background: rgba(251, 191, 36, 0.08); padding: 2px 8px; border-radius: 6px; border: 1px solid rgba(251, 191, 36, 0.18); z-index: 30; }

        .card-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .metric-item { background: rgba(0, 0, 0, 0.22); padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.02); }
        .metric-item-compact { background: rgba(0, 0, 0, 0.22); padding: 6px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.02); }
        .metric-label { font-size: 8px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 2px; font-weight: 600; letter-spacing: 0.3px; }
        .metric-val { font-size: 12px; font-weight: 600; color: var(--text-main); }
        .metric-val-pairs { font-size: 8.5px; font-weight: 400; color: #93c5fd; word-break: break-all; line-height: 1.2; }
        .card-history { display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(0, 0, 0, 0.22); padding: 6px; border-radius: 8px; margin-bottom: 10px; gap: 4px; border: 1px solid rgba(255,255,255,0.02); }
        .c-hist-item { text-align: center; border-right: 1px solid rgba(255,255,255,0.04); }
        .c-hist-item:last-child { border-right: none; }
        .c-hist-label { font-size: 8px; color: var(--text-muted); font-weight: 600; }
        .c-hist-val { font-size: 10px; font-weight: 600; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 9px; color: var(--text-muted); border-top: 1px solid rgba(255,255,255,0.04); padding-top: 8px; margin-top: auto; }
        .empty-state { text-align: center; padding: 40px 15px; color: var(--text-muted); grid-column: 1 / -1; }
    </style>
</head>
<body>

    <div class="river-container"><div class="river-wave-track" id="riverTrack"></div></div>

    <div class="container">
        <!-- ส่วนหัวด้านบน -->
        <div class="top-nav">
            <div class="nav-badges">
                <div class="badge" id="weather-humidity-badge">💧 87%</div>
                <div class="badge" id="weather-temp-badge">🌡️ --°C</div>
                <div class="badge" id="season-badge">☀️ ฤดูหนาว</div>
                <div class="badge" id="theme-badge">⏳ ปกติ</div>
                <div class="status-badge">
                    <div class="status-dot-pulse"></div> 
                    <span>Online</span> 
                    <span id="sync-icon" class="sync-spin" style="margin-left: 2px;">↻</span>
                </div>
            </div>
        </div>

        <header>
            <h1>K sarakharm Farm EA</h1>
            <div class="farm-eco-header-box">
                <div class="farm-eco-line" id="global-forest-line">
                    <span style="font-size: 28px; opacity: 0.5;">กำลังเพาะปลูกป่า...</span>
                </div>
            </div>
        </header>

        <div class="glass-panel">
            <div class="main-stats-grid">
                <div class="stat-box"><div class="stat-label">💰 TOTAL BALANCE (USD)</div><div class="stat-value" id="sum-balance">$0.00</div></div>
                <div class="stat-box"><div class="stat-label">💎 TOTAL EQUITY (USD)</div><div class="stat-value" id="sum-equity">$0.00</div></div>
                <div class="stat-box"><div class="stat-label">📈 FLOATING P/L (USD)</div><div class="stat-value" id="sum-pl">$0.00</div></div>
                
                <div class="stat-box"><div class="stat-label">📊 Profit %</div><div class="stat-value" id="sum-percent">0.00%</div></div>
                <div class="stat-box"><div class="stat-label">🌲 Total Farms</div><div class="stat-value" id="sum-farms" style="color: var(--accent-emerald);">0 แปลง</div></div>
                <div class="stat-box"><div class="stat-label">🌱 Active Trees</div><div class="stat-value" id="sum-trees" style="color: var(--accent-gold);">0 ต้น</div></div>
            </div>
            <div class="divider"></div>
            <div class="history-stats-grid">
                <div class="history-box"><div class="history-label">TODAY</div><div class="history-value" id="sum-today">$0.00</div></div>
                <div class="history-box"><div class="history-label">WEEK</div><div class="history-value" id="sum-week">$0.00</div></div>
                <div class="history-box"><div class="history-label">MONTH</div><div class="history-value" id="sum-month">$0.00</div></div>
                <div class="history-box"><div class="history-label">DRAWDOWN</div><div class="history-value" id="sum-dd">0.00%</div></div>
            </div>
        </div>

        <!-- แถบเครื่องมือ -->
        <div class="toolbar">
            <div class="toolbar-left">
                <div class="search-box">
                    <span style="color: var(--text-muted); font-size: 11px;">🔍</span>
                    <input type="text" id="farmSearchInput" class="search-input" placeholder="ค้นหาเลขพอร์ต..." oninput="filterForestCards()">
                </div>
                <select id="sortSelect" class="sort-select" onchange="changeSortMode()">
                    <option value="balance" selected>💰 เรียงตาม Balance</option>
                    <option value="login">📌 เรียงตามเลขพอร์ต</option>
                    <option value="percent">📈 เรียงตาม % กำไร</option>
                </select>
            </div>
            <div class="toolbar-right">
                <button class="btn-delete-all" onclick="deleteAllFarms()" title="ล้างข้อมูลทั้งหมด">🗑️</button>
            </div>
        </div>

        <div id="forest-grid"></div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbytS0pOy1Vhaf7ZKAooZvDVkoJTVcFK4W4nsImNhqlODyKSQbLAu4ej9Ninr9WPs2JO/exec';
        
        let globalPortfolioData = {};
        let currentSortMode = 'balance';
        let isNightTime = false; 

        // ==========================================
        // ระบบเสียงธรรมชาติใสโปร่ง ไร้อาการอื้อ (High-Pass Filtered + Crisp Water & Forest Birds)
        // ==========================================
        const NatureSoundscape = (() => {
            let ctx = null;
            let initialized = false;
            let hasPlayedWelcome = false;
            let masterGain = null;
            let forestReverbInput = null;
            let breezeGain = null;
            let breezeBandpass = null;
            let currentSceneIndex = -1;
            let toastEl = null;

            // ชุดบรรยากาศป่า 6 รูปแบบที่สลับหมุนเวียนอย่างแผ่วเบา (ตัดย่านเบสอื้อออกทั้งหมด)
            const scenes = [
                { name: 'clear_brook', centerFreq: 1350, q: 0.7, peakGain: 0.038, waterDensity: 1.0 },   // ลำธารใสไหลผ่านโขดหิน
                { name: 'morning_canopy', centerFreq: 1850, q: 0.6, peakGain: 0.032, waterDensity: 0.5 }, // ยอดไม้ยามเช้าและนกร้อง
                { name: 'bamboo_breeze', centerFreq: 1100, q: 0.9, peakGain: 0.042, waterDensity: 0.3 },  // สายลมพัดผ่านป่าไผ่
                { name: 'light_mist', centerFreq: 2400, q: 0.5, peakGain: 0.030, waterDensity: 0.8 },     // ละอองหมอกและหยดน้ำค้าง
                { name: 'sunny_meadow', centerFreq: 1600, q: 0.8, peakGain: 0.028, waterDensity: 0.4 },   // ทุ่งหญ้าโปร่งสบาย
                { name: 'quiet_forest', centerFreq: 1250, q: 0.7, peakGain: 0.018, waterDensity: 0.6 }    // ป่าเงียบสงบฟังเสียงนกชัดๆ
            ];

            function unlockIOSAudio() {
                try {
                    const silentAudio = document.createElement('audio');
                    silentAudio.setAttribute('playsinline', '');
                    silentAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
                    const p = silentAudio.play();
                    if (p && typeof p.catch === 'function') p.catch(() => {});
                } catch (e) {}
            }

            function showToastHint() {
                if (toastEl || (ctx && ctx.state === 'running')) return;
                toastEl = document.createElement('div');
                toastEl.className = 'sound-unlock-toast';
                toastEl.innerHTML = '🌿 แตะหน้าจอ 1 ครั้งเพื่อเปิดเสียงธรรมชาติ';
                document.body.appendChild(toastEl);
            }

            function hideToastHint() {
                if (!toastEl) return;
                const el = toastEl;
                toastEl = null;
                el.classList.add('hidden');
                setTimeout(() => { if (el.parentNode) el.remove(); }, 600);
            }

            function buildAudioGraph() {
                if (initialized) return;
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;

                ctx = new AudioCtx();
                initialized = true;

                masterGain = ctx.createGain();
                masterGain.gain.setValueAtTime(0.9, ctx.currentTime);
                masterGain.connect(ctx.destination);

                // สร้าง Forest Echo (เสียงสะท้อนในป่าโปร่งๆ ให้เสียงนกและหยดน้ำดูมีระยะลึก ไม่กระด้าง)
                forestReverbInput = ctx.createGain();
                forestReverbInput.gain.value = 0.28;

                const delayL = ctx.createDelay();
                delayL.delayTime.value = 0.24;
                const delayR = ctx.createDelay();
                delayR.delayTime.value = 0.37;

                const echoFilter = ctx.createBiquadFilter();
                echoFilter.type = 'bandpass';
                echoFilter.frequency.value = 1800;
                echoFilter.Q.value = 0.7;

                const feedback = ctx.createGain();
                feedback.gain.value = 0.22;

                forestReverbInput.connect(echoFilter);
                echoFilter.connect(delayL);
                delayL.connect(delayR);
                delayR.connect(feedback);
                feedback.connect(echoFilter);

                if (typeof ctx.createStereoPanner === 'function') {
                    const panL = ctx.createStereoPanner();
                    panL.pan.value = -0.65;
                    const panR = ctx.createStereoPanner();
                    panR.pan.value = 0.65;
                    delayL.connect(panL);
                    delayR.connect(panR);
                    panL.connect(masterGain);
                    panR.connect(masterGain);
                } else {
                    delayL.connect(masterGain);
                    delayR.connect(masterGain);
                }

                // สร้าง White Noise แบบเบาบางสำหรับเสียงลมผ่านใบไม้ (ไม่มีเสียงเบสต่ำ)
                const bufferSize = ctx.sampleRate * 4;
                const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = (Math.random() * 2 - 1) * 0.2;
                }

                const noiseSource = ctx.createBufferSource();
                noiseSource.buffer = noiseBuffer;
                noiseSource.loop = true;

                // 1. High-Pass Filter 450 Hz ตัดเสียงอื้อ/เสียงฮัมย่านต่ำออก 100%
                const highPass = ctx.createBiquadFilter();
                highPass.type = 'highpass';
                highPass.frequency.value = 450;

                // 2. Bandpass นุ่มๆ สำหรับเสียงใบไม้ไหว
                breezeBandpass = ctx.createBiquadFilter();
                breezeBandpass.type = 'bandpass';
                breezeBandpass.frequency.value = 1500;
                breezeBandpass.Q.value = 0.7;

                // 3. Lowpass 4200 Hz ตัดเสียงซ่าแหลมบาดหู
                const lowPass = ctx.createBiquadFilter();
                lowPass.type = 'lowpass';
                lowPass.frequency.value = 4200;

                breezeGain = ctx.createGain();
                breezeGain.gain.value = 0.015; // เบาและโปร่งมาก

                noiseSource.connect(highPass);
                highPass.connect(breezeBandpass);
                breezeBandpass.connect(lowPass);
                lowPass.connect(breezeGain);
                breezeGain.connect(masterGain);

                noiseSource.start();

                // เริ่มวงจรเสียงธรรมชาติทั้งหมด
                rotateAmbientScene();
                setInterval(rotateAmbientScene, 22000);
                scheduleBreezeSwell();
                scheduleWaterRipple();
                scheduleNextBirdOrNatureCall();
            }

            function rotateAmbientScene() {
                if (!ctx) return;
                let nextIdx;
                do {
                    nextIdx = Math.floor(Math.random() * scenes.length);
                } while (nextIdx === currentSceneIndex && scenes.length > 1);
                currentSceneIndex = nextIdx;

                const s = scenes[currentSceneIndex];
                const now = ctx.currentTime;
                breezeBandpass.frequency.setTargetAtTime(s.centerFreq, now, 2.5);
                breezeBandpass.Q.setTargetAtTime(s.q, now, 2.5);
            }

            // จังหวะลมพัดผ่านยอดไม้: ค่อยๆ พัดแผ่วเข้ามา 4-6 วินาที แล้วจางหายไปสู่ความเงียบ (ไม่เปิดแช่)
            function scheduleBreezeSwell() {
                if (ctx && ctx.state === 'running' && breezeGain) {
                    const now = ctx.currentTime;
                    const scene = scenes[Math.max(0, currentSceneIndex)];
                    const peak = scene.peakGain * (0.7 + Math.random() * 0.5);
                    const swellIn = 3.5 + Math.random() * 2.5;
                    const swellOut = 4.5 + Math.random() * 3.0;

                    breezeGain.gain.cancelScheduledValues(now);
                    breezeGain.gain.setValueAtTime(breezeGain.gain.value, now);
                    breezeGain.gain.linearRampToValueAtTime(peak, now + swellIn);
                    breezeGain.gain.exponentialRampToValueAtTime(0.004, now + swellIn + swellOut);
                }
                const nextSwell = 11000 + Math.random() * 7000; // เว้นช่วงเงียบสบายหู
                setTimeout(scheduleBreezeSwell, nextSwell);
            }

            function createStereoTarget() {
                if (typeof ctx.createStereoPanner === 'function') {
                    const panner = ctx.createStereoPanner();
                    panner.pan.value = (Math.random() * 1.5) - 0.75;
                    panner.connect(masterGain);
                    panner.connect(forestReverbInput);
                    return panner;
                }
                return masterGain;
            }

            // เสียงน้ำไหลกระทบโขดหิน (ฟองน้ำใสๆ ระดับเสียงเบาละมุน)
            function scheduleWaterRipple() {
                if (ctx && ctx.state === 'running') {
                    const scene = scenes[Math.max(0, currentSceneIndex)];
                    if (Math.random() < scene.waterDensity) {
                        const now = ctx.currentTime;
                        const drops = 1 + Math.floor(Math.random() * 3);
                        const dest = createStereoTarget();

                        for (let i = 0; i < drops; i++) {
                            const t = now + i * (0.09 + Math.random() * 0.14);
                            const osc = ctx.createOscillator();
                            const g = ctx.createGain();

                            osc.type = 'sine';
                            const startF = 950 + Math.random() * 1100;
                            osc.frequency.setValueAtTime(startF, t);
                            osc.frequency.exponentialRampToValueAtTime(startF * (1.35 + Math.random() * 0.4), t + 0.055);

                            g.gain.setValueAtTime(0.0001, t);
                            g.gain.linearRampToValueAtTime(0.022 + Math.random() * 0.015, t + 0.01);
                            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.065);

                            osc.connect(g);
                            g.connect(dest);
                            osc.start(t);
                            osc.stop(t + 0.07);
                        }
                    }
                }
                const nextRipple = 700 + Math.random() * 1600;
                setTimeout(scheduleWaterRipple, nextRipple);
            }

            // เสียงนกป่าร้องหลากหลายสายพันธุ์ (นกขมิ้น, นกปรอด, นกเขา, นกกระจอก, จิ้งหรีดกลางคืน)
            function playNatureCall(forceType = null) {
                if (!ctx || ctx.state !== 'running') return;
                const now = ctx.currentTime;
                const dest = createStereoTarget();

                const dayCalls = ['oriole_flute', 'bulbul_cheer', 'distant_dove', 'sparrow_chirp', 'duo_birds'];
                const nightCalls = ['soft_cricket', 'night_frog', 'distant_dove', 'gentle_drop'];
                const pool = isNightTime ? nightCalls : dayCalls;
                const type = forceType || pool[Math.floor(Math.random() * pool.length)];

                if (type === 'oriole_flute') {
                    // นกขมิ้นร้องเสียงใสกังวานเหมือนขลุ่ย 3-4 โน้ต
                    const melody = [1980, 2480, 2220, 2640];
                    const count = 3 + Math.floor(Math.random() * 2);
                    const shift = 0.9 + Math.random() * 0.25;

                    for (let i = 0; i < count; i++) {
                        const t = now + i * 0.19;
                        const osc = ctx.createOscillator();
                        const g = ctx.createGain();
                        osc.type = 'sine';
                        const f = melody[i % melody.length] * shift;

                        osc.frequency.setValueAtTime(f * 0.96, t);
                        osc.frequency.exponentialRampToValueAtTime(f, t + 0.04);
                        osc.frequency.linearRampToValueAtTime(f * 0.98, t + 0.15);

                        g.gain.setValueAtTime(0.0001, t);
                        g.gain.linearRampToValueAtTime(0.055, t + 0.025);
                        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);

                        osc.connect(g);
                        g.connect(dest);
                        osc.start(t);
                        osc.stop(t + 0.18);
                    }
                } else if (type === 'bulbul_cheer') {
                    // นกปรอดร้องเสียงร่าเริงไล่ระดับ
                    const base = 2400 + Math.random() * 600;
                    const steps = [1.0, 1.25, 1.12, 1.42, 1.2];
                    steps.forEach((ratio, i) => {
                        const t = now + i * 0.11;
                        const osc = ctx.createOscillator();
                        const g = ctx.createGain();
                        osc.type = 'sine';
                        const f = base * ratio;
                        osc.frequency.setValueAtTime(f, t);
                        osc.frequency.exponentialRampToValueAtTime(f * 1.1, t + 0.06);

                        g.gain.setValueAtTime(0.0001, t);
                        g.gain.linearRampToValueAtTime(0.048, t + 0.015);
                        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.095);

                        osc.connect(g);
                        g.connect(dest);
                        osc.start(t);
                        osc.stop(t + 0.10);
                    });
                } else if (type === 'distant_dove') {
                    // เสียงนกป่า/นกเขาร้องทุ้มนุ่มอยู่ไกลๆ
                    const base = 640 + Math.random() * 140;
                    [0, 0.34, 0.68].forEach((offset, idx) => {
                        const t = now + offset;
                        const osc = ctx.createOscillator();
                        const g = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(base, t);
                        osc.frequency.linearRampToValueAtTime(idx === 1 ? base * 1.12 : base * 0.92, t + 0.24);

                        g.gain.setValueAtTime(0.0001, t);
                        g.gain.linearRampToValueAtTime(0.045, t + 0.06);
                        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);

                        osc.connect(g);
                        g.connect(dest);
                        osc.start(t);
                        osc.stop(t + 0.30);
                    });
                } else if (type === 'sparrow_chirp') {
                    // เสียงนกเล็กจิ๊บๆ 2-3 ครั้ง
                    const base = 3100 + Math.random() * 700;
                    const count = 2 + Math.floor(Math.random() * 2);
                    for (let i = 0; i < count; i++) {
                        const t = now + i * 0.14;
                        const osc = ctx.createOscillator();
                        const g = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(base, t);
                        osc.frequency.exponentialRampToValueAtTime(base * 0.78, t + 0.08);

                        g.gain.setValueAtTime(0.0001, t);
                        g.gain.linearRampToValueAtTime(0.042, t + 0.015);
                        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);

                        osc.connect(g);
                        g.connect(dest);
                        osc.start(t);
                        osc.stop(t + 0.10);
                    }
                } else if (type === 'duo_birds') {
                    // นก 2 ตัวร้องรับกันคนละฝั่ง
                    [0, 0.65].forEach((offset, idx) => {
                        const t = now + offset;
                        const osc = ctx.createOscillator();
                        const g = ctx.createGain();
                        osc.type = 'sine';
                        const f = idx === 0 ? 2250 : 2850;
                        osc.frequency.setValueAtTime(f, t);
                        osc.frequency.exponentialRampToValueAtTime(f * 1.18, t + 0.08);
                        osc.frequency.exponentialRampToValueAtTime(f * 0.9, t + 0.20);

                        g.gain.setValueAtTime(0.0001, t);
                        g.gain.linearRampToValueAtTime(0.05, t + 0.025);
                        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);

                        osc.connect(g);
                        g.connect(dest);
                        osc.start(t);
                        osc.stop(t + 0.23);
                    });
                } else if (type === 'soft_cricket') {
                    // เสียงจิ้งหรีดกลางคืนเบาๆ นุ่มๆ
                    const base = 3950 + Math.random() * 350;
                    for (let i = 0; i < 5; i++) {
                        const t = now + i * 0.065;
                        const osc = ctx.createOscillator();
                        const g = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(base, t);

                        g.gain.setValueAtTime(0.0001, t);
                        g.gain.linearRampToValueAtTime(0.025, t + 0.015);
                        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.055);

                        osc.connect(g);
                        g.connect(dest);
                        osc.start(t);
                        osc.stop(t + 0.06);
                    }
                } else if (type === 'night_frog' || type === 'gentle_drop') {
                    const osc = ctx.createOscillator();
                    const g = ctx.createGain();
                    osc.type = 'sine';
                    const f = 1150 + Math.random() * 300;
                    osc.frequency.setValueAtTime(f, now);
                    osc.frequency.exponentialRampToValueAtTime(f * 1.45, now + 0.08);

                    g.gain.setValueAtTime(0.0001, now);
                    g.gain.linearRampToValueAtTime(0.035, now + 0.015);
                    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.10);

                    osc.connect(g);
                    g.connect(dest);
                    osc.start(now);
                    osc.stop(now + 0.11);
                }
            }

            function scheduleNextBirdOrNatureCall() {
                const delay = 2400 + Math.random() * 3800; // สุ่มทุก 2.4 - 6.2 วินาที
                setTimeout(() => {
                    playNatureCall();
                    scheduleNextBirdOrNatureCall();
                }, delay);
            }

            function onRunningConfirmed() {
                hideToastHint();
                if (!hasPlayedWelcome) {
                    hasPlayedWelcome = true;
                    setTimeout(() => playNatureCall('oriole_flute'), 100);
                }
            }

            function unlockAndPlay(fromGesture = false) {
                if (fromGesture) unlockIOSAudio();
                buildAudioGraph();
                if (!ctx) return;

                if (ctx.state === 'running') {
                    onRunningConfirmed();
                } else if (ctx.state === 'suspended') {
                    ctx.resume().then(() => {
                        if (ctx.state === 'running') onRunningConfirmed();
                    }).catch(() => {});
                }
            }

            return {
                start: () => {
                    unlockAndPlay(false);

                    setTimeout(() => {
                        if (!ctx || ctx.state !== 'running') {
                            showToastHint();
                        } else {
                            onRunningConfirmed();
                        }
                    }, 400);

                    const events = ['pointerdown', 'touchstart', 'touchend', 'click', 'keydown'];
                    const onGesture = () => {
                        unlockAndPlay(true);
                        if (ctx && ctx.state === 'running') {
                            events.forEach(ev => window.removeEventListener(ev, onGesture, true));
                        }
                    };
                    events.forEach(ev => window.addEventListener(ev, onGesture, { capture: true, passive: true }));
                }
            };
        })();

        function convertToUSD(amount, currency) {
            const curr = (currency || 'USD').toUpperCase();
            if (curr === 'USC' || curr === 'CENT') return Number(amount) / 100;
            const rates = { 'USD': 1.0, 'USDT': 1.0, 'EUR': 1.08, 'GBP': 1.27, 'JPY': 0.0067, 'THB': 0.029, 'AUD': 0.65, 'CAD': 0.73, 'SGD': 0.75 };
            return Number(amount) * (rates[curr] || 1.0);
        }

        function getMaxFarmBalance() {
            let max = 0;
            for (const key in globalPortfolioData) {
                const d = globalPortfolioData[key];
                if (d && !d.error && d.balance > 0) {
                    const usdBal = convertToUSD(d.balance, d.currency);
                    if (usdBal > max) max = usdBal;
                }
            }
            return max;
        }

        function getSeasonInfo() {
            const m = new Date().getMonth();
            if (m === 10 || m === 11 || m === 0 || m === 1) return { name: 'ฤดูหนาว', icon: '❄️' };
            if (m >= 2 && m <= 4) return { name: 'ฤดูร้อน', icon: '☀️' };
            return { name: 'ฤดูฝน', icon: '🌧️' };
        }

        function getHashCode(str) {
            let hash = 0;
            const s = String(str);
            for (let i = 0; i < s.length; i++) {
                hash = ((hash << 5) - hash) + s.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash);
        }

        let activeEnvironmentInterval = null;

        function fetchRealWorldWeather() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        try { await fetch(`${SCRIPT_URL}?action=updateGPS&lat=${lat}&lon=${lon}`); } catch(e) {}
                        fetchWeatherByCoords(lat, lon);
                    }, 
                    async (error) => {
                        try {
                            const res = await fetch(`${SCRIPT_URL}?action=getGPS`);
                            const data = await res.json();
                            if(data && data.lat && data.lon) fetchWeatherByCoords(data.lat, data.lon);
                            else fallbackDefaultWeather(); 
                        } catch(e) { fallbackDefaultWeather(); }
                    }, 
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
                );
            } else { fallbackDefaultWeather(); }
        }

        async function fetchWeatherByCoords(lat, lon) {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,is_day,weather_code`);
                const data = await res.json();
                if (data && data.current) {
                    document.getElementById('weather-humidity-badge').innerHTML = `💧 ${data.current.relative_humidity_2m}%`;
                    document.getElementById('weather-temp-badge').innerHTML = `🌡️ ${data.current.temperature_2m}°C`;
                    isNightTime = data.current.is_day === 0;
                    setupEnvironmentEffects(); 
                }
            } catch(e) { fallbackDefaultWeather(); }
        }

        function fallbackDefaultWeather() {
            const hour = new Date().getHours();
            isNightTime = (hour >= 18 || hour < 6);
            document.getElementById('weather-humidity-badge').innerHTML = `💧 85%`;
            document.getElementById('weather-temp-badge').innerHTML = `🌡️ 28°C`;
            setupEnvironmentEffects();
        }

        function updateGlobalWeather(totalPercent) {
            let themeName = 'ปกติ ⛅'; let bgDark = '#050907'; 
            if (totalPercent >= 15) { themeName = 'รุ้งงาม 🌈'; bgDark = isNightTime ? '#020604' : '#041007'; } 
            else if (totalPercent >= 5) { themeName = 'แดดจ้า ☀️'; bgDark = isNightTime ? '#020604' : '#041007'; } 
            else if (totalPercent >= 0) { themeName = 'สดใส ⛅'; bgDark = isNightTime ? '#030704' : '#050907'; } 
            else { themeName = 'พายุ ⛈️'; bgDark = isNightTime ? '#080304' : '#100608'; }
            document.documentElement.style.setProperty('--bg-dark', bgDark);
            document.getElementById('theme-badge').innerHTML = `${themeName}`;
        }

        function renderGlobalForest() {
            const forestLine = document.getElementById('global-forest-line');
            if (!forestLine) return;

            const allFarms = getFarmsList();
            const maxBalance = Math.max(getMaxFarmBalance(), 1);
            
            let validFarms = [];
            allFarms.forEach(login => {
                const d = globalPortfolioData[login];
                if (d && !d.error) validFarms.push({ login, data: d });
            });

            if (validFarms.length === 0) {
                forestLine.innerHTML = `<span class="forest-tree" style="font-size: 32px;">🌳</span><span class="forest-tree glowing" style="font-size: 38px;">🌲</span><span class="forest-tree" style="font-size: 30px;">🌴</span>`;
                return;
            }

            const bigTrees = ['🌲', '🌳', '🌴'];
            const smallLeaves = ['🌿', '🌱'];

            let forestItems = validFarms.map((item) => {
                const login = item.login;
                const d = item.data;
                const usdBalance = convertToUSD(d.balance, d.currency);
                const relativePercent = (usdBalance / maxBalance) * 100;
                const hashType = getHashCode(login + '_species');
                const hashPos = getHashCode(login + '_position');

                let emoji = '🌱';
                let size = 12;
                let glowClass = '';
                let isLeafOrFlower = false;

                if (d.profit < 0) {
                    emoji = '🥀';
                    size = 13;
                    isLeafOrFlower = true;
                } else {
                    if (d.profit > 0) glowClass = 'glowing';

                    if (relativePercent >= 25) {
                        emoji = bigTrees[hashType % bigTrees.length];
                        size = Math.round(28 + ((relativePercent - 25) / 75) * 14);
                    } else {
                        emoji = smallLeaves[hashType % smallLeaves.length];
                        size = relativePercent >= 12 ? 13 : 11;
                        isLeafOrFlower = true;
                    }
                }

                return {
                    login,
                    data: d,
                    emoji,
                    size,
                    glowClass,
                    isLeafOrFlower,
                    sortKey: hashPos
                };
            });

            forestItems.sort((a, b) => a.sortKey - b.sortKey);

            for (let i = 1; i < forestItems.length; i++) {
                if (forestItems[i].emoji === forestItems[i - 1].emoji) {
                    let swapIdx = -1;
                    for (let j = i + 1; j < forestItems.length; j++) {
                        if (forestItems[j].emoji !== forestItems[i - 1].emoji) {
                            swapIdx = j;
                            break;
                        }
                    }
                    if (swapIdx !== -1) {
                        const temp = forestItems[i];
                        forestItems[i] = forestItems[swapIdx];
                        forestItems[swapIdx] = temp;
                    } else if (!forestItems[i].isLeafOrFlower) {
                        const currentIdx = bigTrees.indexOf(forestItems[i - 1].emoji);
                        forestItems[i].emoji = bigTrees[(currentIdx + 1) % bigTrees.length];
                    } else if (forestItems[i].emoji !== '🥀') {
                        forestItems[i].emoji = forestItems[i - 1].emoji === '🌿' ? '🌱' : '🌿';
                    }
                }
            }

            const treesHtml = forestItems.map(item => 
                `<span class="forest-tree ${item.glowClass}" style="font-size: ${item.size}px;" title="แปลง #${item.login} (${item.data.profit > 0 ? '+' : ''}${item.data.profit})">${item.emoji}</span>`
            ).join('');

            forestLine.innerHTML = treesHtml;
        }

        async function syncAndRefreshAll() {
            const syncIcon = document.getElementById('sync-icon');
            if (syncIcon) syncIcon.classList.add('sync-spin', 'sync-glow'); 

            await syncFarmsFromCloud();
            const farms = getFarmsList();
            if (farms.length > 0) {
                await Promise.all(farms.map(login => fetchNodeData(login)));
                farms.forEach(login => updateUICard(login));
            }

            setTimeout(() => { if (syncIcon) syncIcon.classList.remove('sync-spin', 'sync-glow'); }, 500);
        }

        async function syncFarmsFromCloud() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getAllFarms`);
                const cloudFarms = await response.json();
                if(Array.isArray(cloudFarms)) {
                    let oldFarms = JSON.parse(localStorage.getItem('my_forest_farms') || '[]');
                    let mergedFarms = [...new Set([...oldFarms, ...cloudFarms])];
                    if (oldFarms.length !== mergedFarms.length) {
                        saveFarmsList(mergedFarms); renderForest();
                    }
                }
            } catch(e) {}
        }

        function initRiver() { document.getElementById('riverTrack').innerHTML = '<div class="river-wave-item">ระบบชลประทานอัจฉริยะหล่อเลี้ยงฟาร์มการลงทุน เปล่งประกายรุ่งเรือง</div>'.repeat(8); }

        function changeSortMode() { currentSortMode = document.getElementById('sortSelect').value; applySortOrder(); }

        function getFarmsList() { 
            let farms = JSON.parse(localStorage.getItem('my_forest_farms') || '[]');
            return farms.sort((a, b) => {
                const dataA = globalPortfolioData[a] || { balance: 0, percent: 0 };
                const dataB = globalPortfolioData[b] || { balance: 0, percent: 0 };
                const balA = convertToUSD(dataA.balance, dataA.currency) || 0; 
                const balB = convertToUSD(dataB.balance, dataB.currency) || 0;
                if (balA === 0 && balB !== 0) return 1;
                if (balB === 0 && balA !== 0) return -1;
                if (currentSortMode === 'login') return a.localeCompare(b);
                if (currentSortMode === 'balance') return balB - balA;
                return (dataB.percent || 0) - (dataA.percent || 0);
            });
        }
        
        function saveFarmsList(farms) { localStorage.setItem('my_forest_farms', JSON.stringify(farms)); }
        function applySortOrder() { getFarmsList().forEach((login, index) => { const card = document.querySelector(`.tree-card[data-login="${login}"]`); if (card) card.style.order = index; }); }

        window.removeFarm = async function(login) {
            const confirmCode = prompt(`กรุณากรอกรหัส PIN เพื่อยืนยันการลบแปลงพอร์ต ${login}:`);
            if (confirmCode !== '17091709') return alert('รหัส PIN ไม่ถูกต้อง!');
            await fetch(`${SCRIPT_URL}?action=deleteFarm&login=${login}`);
            let farms = JSON.parse(localStorage.getItem('my_forest_farms') || '[]').filter(f => f !== login); 
            saveFarmsList(farms); 
            delete globalPortfolioData[login]; 
            localStorage.setItem('my_forest_portfolio_data', JSON.stringify(globalPortfolioData));
            updatePortfolioSummary(); renderForest();
        };

        window.deleteAllFarms = async function() {
            const confirmCode = prompt(`กรุณากรอกรหัส PIN เพื่อยืนยันการล้างข้อมูลฟาร์มทั้งหมด:`);
            if (confirmCode !== '17091709') return alert('รหัส PIN ไม่ถูกต้อง!');
            await fetch(`${SCRIPT_URL}?action=deleteAllFarms`);
            localStorage.setItem('my_forest_farms', '[]'); 
            globalPortfolioData = {}; 
            localStorage.removeItem('my_forest_portfolio_data');
            updatePortfolioSummary(); renderForest(); alert('ล้างข้อมูลเรียบร้อยแล้ว');
        };

        function filterForestCards() {
            const query = document.getElementById('farmSearchInput').value.toLowerCase();
            const farms = getFarmsList();
            farms.forEach(login => {
                const card = document.querySelector(`.tree-card[data-login="${login}"]`);
                if (card) card.style.display = login.toLowerCase().includes(query) ? 'flex' : 'none';
            });
        }

        function renderForest() {
            const grid = document.getElementById('forest-grid'); grid.innerHTML = ''; 
            const farms = JSON.parse(localStorage.getItem('my_forest_farms') || '[]'); 
            if (farms.length === 0) { grid.innerHTML = `<div class="empty-state"><h3>ยังไม่มีแปลงเกษตรในระบบ</h3><p>ระบบจะสร้างแปลงให้อัตโนมัติเมื่อ EA ส่งข้อมูลเข้ามา</p></div>`; return; }

            farms.forEach(login => {
                const card = document.createElement('div'); card.className = 'tree-card'; card.setAttribute('data-login', login);
                card.innerHTML = `
                    <div class="card-header"><div class="plot-title"><span id="plot-icon-${login}">🌱</span> แปลง #${login} <span class="currency-badge" id="badge-${login}">USD</span><span class="stars" id="stars-${login}"></span></div><button class="btn-delete" onclick="window.removeFarm('${login}')">✕</button></div>
                    <div class="showcase" id="showcase-${login}"><div class="weather-pill" id="wpill-${login}">⏳ รอข้อมูล</div><div class="forest-cluster" id="cluster-${login}" data-state="none"><div class="tree-extra" style="font-size:14px;">🌱</div></div><div class="level-badge" id="tier-${login}">เตรียมแปลง...</div></div>
                    <div class="card-metrics">
                        <div class="metric-item"><div class="metric-label">INITIAL BALANCE</div><div class="metric-val" id="bal-${login}">0.00</div></div>
                        <div class="metric-item"><div class="metric-label">CURRENT EQUITY</div><div class="metric-val" id="eq-${login}">0.00</div></div>
                        <div class="metric-item"><div class="metric-label">FLOATING P/L</div><div class="metric-val" id="pl-${login}">0.00</div></div>
                        <div class="metric-item"><div class="metric-label">ORDERS</div><div class="metric-val" id="ord-${login}">-</div></div>
                        <div class="metric-item-compact"><div class="metric-label" style="font-size: 8px;">ACTIVE PAIRS</div><div class="metric-val-pairs" id="pairs-${login}">-</div></div>
                        <div class="metric-item-compact" style="background: rgba(251, 146, 60, 0.04); border-color: rgba(251, 146, 60, 0.15);"><div class="metric-label" style="color: #fb923c; font-size: 8px;">DRAWDOWN</div><div class="metric-val" id="dd-${login}" style="color: #fb923c; font-size: 10px;">0.00%</div></div>
                    </div>
                    <div class="card-history">
                        <div class="c-hist-item"><div class="c-hist-label">วันนี้</div><div class="c-hist-val" id="today-${login}">0.00</div></div>
                        <div class="c-hist-item"><div class="c-hist-label">สัปดาห์นี้</div><div class="c-hist-val" id="week-${login}">0.00</div></div>
                        <div class="c-hist-item"><div class="c-hist-label">เดือนนี้</div><div class="c-hist-val" id="month-${login}">0.00</div></div>
                    </div>
                    <div class="card-footer"><span id="status-${login}" style="color:var(--accent-emerald);">● ออนไลน์</span><span id="time-${login}">--:--</span></div>`;
                grid.appendChild(card);
            });
            farms.forEach(login => { if (globalPortfolioData[login]) updateUICard(login); });
        }

        async function fetchNodeData(login) {
            try {
                const response = await fetch(`${SCRIPT_URL}?login=${login}`); 
                const data = await response.json();
                if (data.error || data.length === 0) { globalPortfolioData[login] = { error: true }; } 
                else {
                    const latest = data[0]; 
                    globalPortfolioData[login] = { 
                        balance: parseFloat(latest.balance), equity_from_sheet: parseFloat(latest.equity), profit: parseFloat(latest.floating_pl),
                        percent: (parseFloat(latest.balance) > 0) ? (parseFloat(latest.floating_pl) / parseFloat(latest.balance)) * 100 : 0, 
                        open_positions: parseInt(latest.open_positions || 0), profit_orders: parseInt(latest.profit_orders || 0), loss_orders: parseInt(latest.loss_orders || 0),
                        profit_today: parseFloat(latest.profit_today || 0), profit_week: parseFloat(latest.profit_week || 0), profit_month: parseFloat(latest.profit_month || 0),
                        currency: latest.currency || 'USD', open_pairs: latest.open_pairs || '-', lastUpdated: latest.lastUpdated, error: false,
                        dd_amount: latest.max_dd_amount || 0, dd_percent: latest.max_dd_percent || 0
                    };
                }
                localStorage.setItem('my_forest_portfolio_data', JSON.stringify(globalPortfolioData));
                updatePortfolioSummary(); updateUICard(login);
            } catch (err) { globalPortfolioData[login] = { error: true }; updateUICard(login); }
        }

        const formatMoney = (val, prefix = '$', suffix = '') => { const absVal = Math.abs(val).toFixed(2); return val > 0 ? `+${prefix}${absVal}${suffix}` : (val < 0 ? `-${prefix}${absVal}${suffix}` : `${prefix}${absVal}${suffix}`); };
        const formatPercent = (val) => { const absVal = Math.abs(val).toFixed(2); return val > 0 ? `(+${absVal}%)` : (val < 0 ? `(-${absVal}%)` : `(0.00%)`); };
        const getColorClass = (val) => val > 0 ? 'positive' : (val < 0 ? 'negative' : '');

        function updateUICard(login) {
            const data = globalPortfolioData[login]; if (!data) return;
            const statusDiv = document.getElementById(`status-${login}`);
            if (!statusDiv) return;
            if (data.error) { statusDiv.innerHTML = '<span style="color:var(--accent-rose)">● ขาดการติดต่อ</span>'; return; }
            statusDiv.innerHTML = '<span style="color:var(--accent-emerald)">● สมบูรณ์</span>';

            document.getElementById(`badge-${login}`).innerText = data.currency;
            document.getElementById(`pairs-${login}`).innerText = data.open_pairs;
            document.getElementById(`bal-${login}`).innerText = `${data.balance.toFixed(2)} ${data.currency}`; 
            
            const dashboardEquity = data.balance + data.profit;
            const calculatedCredit = data.equity_from_sheet - dashboardEquity;
            const eqDiv = document.getElementById(`eq-${login}`);
            if (calculatedCredit > 0.01) eqDiv.innerHTML = `${dashboardEquity.toFixed(2)} ${data.currency} <span style="font-size: 9px; color: var(--accent-emerald);">+${calculatedCredit.toFixed(2)}</span>`;
            else eqDiv.innerText = `${dashboardEquity.toFixed(2)} ${data.currency}`;
            
            const plDiv = document.getElementById(`pl-${login}`);
            plDiv.className = `metric-val ${getColorClass(data.profit)}`; 
            plDiv.innerText = `${formatMoney(data.profit, '', ' ' + data.currency)} ${formatPercent(data.percent)}`;
            document.getElementById(`ord-${login}`).innerHTML = `<span style="color:var(--accent-emerald)">🟢 ${data.profit_orders}</span> | <span style="color:var(--accent-rose)">🔴 ${data.loss_orders}</span>`;
            
            const ddElem = document.getElementById(`dd-${login}`);
            ddElem.innerText = data.dd_amount < 0 ? `(-${Math.abs(data.dd_percent).toFixed(2)}%)` : `(0.00%)`;

            ['today', 'week', 'month'].forEach(t => {
                const val = data[`profit_${t}`]; const div = document.getElementById(`${t}-${login}`);
                div.innerText = formatMoney(val, '', ' ' + data.currency); div.className = `c-hist-val ${getColorClass(val)}`;
            });

            const usdBalance = convertToUSD(data.balance, data.currency);
            const maxBalance = Math.max(getMaxFarmBalance(), 1); 
            const relativePercent = (usdBalance / maxBalance) * 100;

            const showcase = document.getElementById(`showcase-${login}`);
            const cluster = document.getElementById(`cluster-${login}`);
            const tier = document.getElementById(`tier-${login}`);
            const plotIcon = document.getElementById(`plot-icon-${login}`);
            const wpill = document.getElementById(`wpill-${login}`);
            const stars = document.getElementById(`stars-${login}`);

            let treeHtml = ''; let tierText = ''; let plotEmoji = '🌱'; let weatherText = 'อากาศดี'; let starCount = '';

            if (data.profit < 0) {
                showcase.classList.add('danger-zone'); cluster.setAttribute('data-state', 'danger');
                treeHtml = `<div class="tree-extra withered" style="font-size:16px; bottom:14px;">🥀</div>`;
                tierText = '⚠️ พื้นที่เฝ้าระวังพิเศษ'; plotEmoji = '🥀'; weatherText = 'พายุฝนฟ้าคะนอง ⛈️';
            } else {
                showcase.classList.remove('danger-zone');
                if (relativePercent >= 90) { cluster.setAttribute('data-state', 'legendary'); treeHtml = `<div class="tree-extra" style="font-size:44px; bottom:10px; filter:drop-shadow(0 0 12px rgba(251,191,36,0.9));">🌲</div><div class="tree-extra" style="font-size:30px; bottom:6px; left:16px;">🌳</div><div class="tree-extra" style="font-size:30px; bottom:6px; right:16px;">🌴</div>`; tierText = '🌟 ป่าดงดิบมหาเศรษฐี (Lv.10)'; plotEmoji = '🌲'; weatherText = 'ทองคำเปล่งประกาย ✨'; starCount = '⭐⭐⭐⭐⭐'; } 
                else if (relativePercent >= 80) { cluster.setAttribute('data-state', 'epic'); treeHtml = `<div class="tree-extra" style="font-size:40px; bottom:10px;">🌳</div><div class="tree-extra" style="font-size:28px; bottom:6px; left:16px;">🌲</div><div class="tree-extra" style="font-size:28px; bottom:6px; right:16px;">🌴</div>`; tierText = '👑 มหาพฤกษา (Lv.9)'; plotEmoji = '🌳'; weatherText = 'แสงออร่า 🌟'; starCount = '⭐⭐⭐⭐⭐'; } 
                else if (relativePercent >= 70) { cluster.setAttribute('data-state', 'epic'); treeHtml = `<div class="tree-extra" style="font-size:38px; bottom:10px;">🌴</div><div class="tree-extra" style="font-size:26px; bottom:6px; right:18px;">🌳</div>`; tierText = '💎 ป่าสนศักดิ์สิทธิ์ (Lv.8)'; plotEmoji = '🌴'; weatherText = 'แดดจ้า ☀️'; starCount = '⭐⭐⭐⭐'; } 
                else if (relativePercent >= 60) { cluster.setAttribute('data-state', 'epic'); treeHtml = `<div class="tree-extra" style="font-size:36px; bottom:10px;">🌲</div><div class="tree-extra" style="font-size:13px; bottom:8px; left:22px;">🌿</div>`; tierText = '🌳 ป่าอุดมสมบูรณ์ (Lv.7)'; plotEmoji = '🌲'; weatherText = 'แดดจ้า ☀️'; starCount = '⭐⭐⭐⭐'; } 
                else if (relativePercent >= 50) { cluster.setAttribute('data-state', 'rare'); treeHtml = `<div class="tree-extra" style="font-size:38px; bottom:10px;">🌳</div>`; tierText = '🌿 สวนป่าร่มรื่น (Lv.6)'; plotEmoji = '🌳'; weatherText = 'ลมโชย 🍃'; starCount = '⭐⭐⭐'; } 
                else if (relativePercent >= 40) { cluster.setAttribute('data-state', 'rare'); treeHtml = `<div class="tree-extra" style="font-size:34px; bottom:10px;">🌴</div>`; tierText = '🌲 ต้นไม้ใหญ่ (Lv.5)'; plotEmoji = '🌴'; weatherText = 'อากาศดี ⛅'; starCount = '⭐⭐⭐'; } 
                else if (relativePercent >= 30) { cluster.setAttribute('data-state', 'rare'); treeHtml = `<div class="tree-extra" style="font-size:15px; bottom:12px;">🌿</div>`; tierText = '🌿 ต้นไม้กำลังโต (Lv.4)'; plotEmoji = '🌿'; weatherText = 'รดน้ำชุ่มชื้น 💧'; starCount = '⭐⭐'; } 
                else if (relativePercent >= 20) { cluster.setAttribute('data-state', 'seedling'); treeHtml = `<div class="tree-extra" style="font-size:14px; bottom:12px;">🌿</div>`; tierText = '🌿 ต้นไม้เล็ก (Lv.3)'; plotEmoji = '🌿'; weatherText = 'รดน้ำชุ่มชื้น 💧'; starCount = '⭐⭐'; } 
                else if (relativePercent >= 10) { cluster.setAttribute('data-state', 'seedling'); treeHtml = `<div class="tree-extra" style="font-size:13px; bottom:12px;">🌱</div>`; tierText = '🌱 ต้นกล้า (Lv.2)'; plotEmoji = '🌱'; weatherText = 'รดน้ำพรวนดิน 💧'; starCount = '⭐'; } 
                else { cluster.setAttribute('data-state', 'seedling'); treeHtml = `<div class="tree-extra" style="font-size:11px; bottom:12px;">🌱</div>`; tierText = '🌱 เพาะเมล็ด (Lv.1)'; plotEmoji = '🌱'; weatherText = 'ลงดินเพาะปลูก 💧'; starCount = '⭐'; }
            }

            cluster.innerHTML = treeHtml + `<div class="terrain-base terrain-glow">🌱 🌿 🌾 🌿 🌱</div>`;
            tier.innerText = tierText; plotIcon.innerText = plotEmoji; wpill.innerHTML = `<span>${weatherText}</span>`; stars.innerText = starCount;
            
            if (data.lastUpdated) {
                const date = new Date(data.lastUpdated);
                if (!isNaN(date)) document.getElementById(`time-${login}`).innerText = `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`; 
            }
        }

        function updatePortfolioSummary() {
            let totalUsdBalance = 0, totalUsdProfit = 0, tTrees = 0, totalUsdToday = 0, totalUsdWeek = 0, totalUsdMonth = 0, totalUsdDD = 0, sumEquityFromSheet = 0; 
            
            let activeOrderFarmsCount = 0;
            let fundedFarmsCount = 0;

            const allFarms = getFarmsList();
            const totalSheetFarmsCount = allFarms.length;

            allFarms.forEach(login => {
                const d = globalPortfolioData[login]; 
                if (d && !d.error) { 
                    if (d.open_positions > 0) {
                        activeOrderFarmsCount++;
                    }
                    if (d.balance > 0) {
                        fundedFarmsCount++;
                        totalUsdBalance += convertToUSD(d.balance, d.currency); 
                        totalUsdProfit += convertToUSD(d.profit, d.currency); 
                        sumEquityFromSheet += convertToUSD(d.equity_from_sheet, d.currency); 
                        tTrees += d.open_positions; 
                        totalUsdToday += convertToUSD(d.profit_today || 0, d.currency); 
                        totalUsdWeek += convertToUSD(d.profit_week || 0, d.currency); 
                        totalUsdMonth += convertToUSD(d.profit_month || 0, d.currency); 
                        totalUsdDD += convertToUSD(d.dd_amount || 0, d.currency);
                    }
                }
            });

            document.getElementById('sum-balance').innerText = `$${totalUsdBalance.toFixed(2)}`; 
            
            const totalDashboardEquity = totalUsdBalance + totalUsdProfit;
            const totalCalculatedCredit = sumEquityFromSheet - totalDashboardEquity;
            const sumEqElem = document.getElementById('sum-equity');
            if (totalCalculatedCredit > 0.01) sumEqElem.innerHTML = `$${totalDashboardEquity.toFixed(2)} <span style="font-size: 9px; color: var(--accent-emerald); font-weight: normal;">+$${totalCalculatedCredit.toFixed(2)}</span>`;
            else sumEqElem.innerText = `$${totalDashboardEquity.toFixed(2)}`;
            
            const plElem = document.getElementById('sum-pl'); plElem.className = 'stat-value ' + getColorClass(totalUsdProfit); plElem.innerText = formatMoney(totalUsdProfit);
            
            const totalPercent = (totalUsdBalance > 0) ? (totalUsdProfit / totalUsdBalance) * 100 : 0;
            const percentElem = document.getElementById('sum-percent'); percentElem.className = 'stat-value ' + getColorClass(totalPercent); percentElem.innerText = (totalPercent > 0 ? '+' : '') + totalPercent.toFixed(2) + '%';
            
            document.getElementById('sum-farms').innerHTML = `${activeOrderFarmsCount}/${fundedFarmsCount} แปลง <span style="font-size: 9px; color: var(--text-muted); font-weight: normal;">(${totalSheetFarmsCount} แปลง)</span>`; 
            document.getElementById('sum-trees').innerText = `${tTrees} ต้น`;

            const updateSum = (id, val) => { const el = document.getElementById(id); el.innerText = formatMoney(val); el.className = 'history-value ' + getColorClass(val); };
            updateSum('sum-today', totalUsdToday); updateSum('sum-week', totalUsdWeek); updateSum('sum-month', totalUsdMonth);

            const sumDdElem = document.getElementById('sum-dd');
            if (totalUsdDD < 0) { sumDdElem.innerText = `(-${((Math.abs(totalUsdDD) / totalUsdBalance) * 100).toFixed(2)}%)`; sumDdElem.style.color = '#fb923c'; } 
            else { sumDdElem.innerText = `(0.00%)`; sumDdElem.style.color = 'var(--text-main)'; }

            updateGlobalWeather(totalPercent);
            renderGlobalForest(); 
        }
    </script>
