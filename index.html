<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ป่าไม้แห่งการลงทุน - Living Forest</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --forest-dark: #071911;
            --forest-card: rgba(14, 38, 26, 0.75);
            --forest-border: rgba(52, 211, 153, 0.25);
            --leaf-green: #34d399;
            --text-light: #ecfdf5;
            --text-dim: #9ca3af;
            --danger-red: #f87171;
            --sun-gold: #fbbf24;
            --card-hover: rgba(20, 48, 35, 0.95);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--forest-dark);
            background-image: 
                radial-gradient(circle at 20% 10%, rgba(16, 185, 129, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 80% 90%, rgba(5, 150, 105, 0.12) 0%, transparent 40%);
            color: var(--text-light);
            margin: 0; padding: 40px 20px 100px 20px;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            transition: background-color 2.5s ease-in-out;
        }

        /* 🌊 สายน้ำไหล */
        .river-container {
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 50px;
            background: linear-gradient(180deg, rgba(4, 47, 46, 0.5) 0%, rgba(2, 44, 34, 0.95) 100%);
            border-top: 2px solid rgba(52, 211, 153, 0.4);
            z-index: 999;
            box-shadow: 0 -15px 40px rgba(52, 211, 153, 0.2);
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .river-wave-track {
            display: flex;
            white-space: nowrap;
            animation: flowRiver 20s linear infinite;
        }

        .river-wave-item {
            font-size: 16px;
            font-weight: 500;
            color: rgba(110, 231, 183, 0.8);
            padding-right: 40px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.5);
        }

        @keyframes flowRiver { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* 🍃 เอฟเฟกต์ตกจากฟ้าตามสภาพอากาศ */
        .weather-particle {
            position: fixed; top: -50px;
            user-select: none; pointer-events: none;
            z-index: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        
        @keyframes fallParticle {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.9; }
            100% { transform: translateY(105vh) translateX(120px) rotate(360deg); opacity: 0; }
        }
        @keyframes fallRain {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(105vh) translateX(10px) scale(0.8); opacity: 0; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 28, 20, 0.6);
            border: 1px solid var(--forest-border);
            padding: 12px 25px;
            border-radius: 35px;
            margin-bottom: 25px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 2s ease;
        }

        .badges-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

        .nature-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(52, 211, 153, 0.15); color: var(--leaf-green);
            padding: 8px 18px; border-radius: 30px; font-size: 14px; font-weight: 600;
            border: 1px solid rgba(52, 211, 153, 0.3);
        }

        .badge-item {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 15px; border-radius: 30px; font-size: 13px; font-weight: 500;
            background: rgba(255,255,255,0.05); color: #e5e7eb; border: 1px solid rgba(255,255,255,0.1);
        }

        header { text-align: center; margin-bottom: 35px; }

        h1 {
            font-size: 42px; font-weight: 700; margin: 0 0 8px 0;
            background: linear-gradient(135deg, #ffffff 0%, #6ee7b7 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px; filter: drop-shadow(0 4px 10px rgba(52,211,153,0.2));
        }

        p.subtitle { color: var(--text-dim); font-size: 16px; margin: 0; }

        .search-box-container { display: flex; justify-content: center; margin-bottom: 25px; }
        .search-input {
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255,255,255,0.1); color: var(--text-light);
            padding: 14px 25px; border-radius: 35px; font-size: 16px; font-family: inherit; width: 100%; max-width: 500px;
            outline: none; box-shadow: inset 0 2px 5px rgba(0,0,0,0.5); backdrop-filter: blur(10px); text-align: center;
        }
        .search-input:focus { border-color: var(--leaf-green); box-shadow: 0 0 20px rgba(52, 211, 153, 0.2); }

        .summary-dashboard {
            background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 35px; padding: 25px; margin-bottom: 35px; backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: grid; grid-template-columns: repeat(6, 1fr); gap: 20px;
        }

        @media (max-width: 1100px) { .summary-dashboard { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 600px) { .summary-dashboard { grid-template-columns: repeat(2, 1fr); } }

        .summary-item {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.02);
            padding: 18px 10px; border-radius: 20px; text-align: center; transition: 0.3s;
        }
        .summary-item:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.08); border-color: rgba(52, 211, 153, 0.3); }
        .summary-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 600; }
        .summary-val { font-size: 22px; font-weight: 700; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .summary-val.positive { color: var(--leaf-green); } .summary-val.negative { color: var(--danger-red); }

        .control-box { display: flex; justify-content: center; align-items: center; width: 100%; flex-wrap: wrap; gap: 20px; margin-bottom: 45px; }

        .btn-water {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: #fff;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4); padding: 15px 40px; border-radius: 35px;
            font-weight: 600; font-size: 16px; font-family: inherit; cursor: pointer;
            display: inline-flex; align-items: center; gap: 10px; border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-water:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 12px 30px rgba(59, 130, 246, 0.6); }

        .auto-sync-container {
            display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.3);
            padding: 14px 25px; border-radius: 35px; border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-light); font-weight: 500; font-size: 15px; cursor: pointer;
        }

        #forest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 30px; }

        .tree-card {
            background: var(--forest-card); backdrop-filter: blur(25px);
            border: 1px solid var(--forest-border); border-radius: 35px; padding: 25px;
            position: relative; box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; order: 999;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tree-card:hover { transform: translateY(-8px); border-color: rgba(52, 211, 153, 0.6); box-shadow: 0 25px 50px rgba(16, 185, 129, 0.25); z-index: 2; }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .plot-number {
            font-size: 20px; font-weight: 700; color: #fff; display: flex; align-items: center;
            background: rgba(0,0,0,0.4); padding: 8px 18px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.05);
        }

        .delete-btn {
            background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.2);
            color: var(--danger-red); width: 36px; height: 36px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s;
        }
        .delete-btn:hover { background: var(--danger-red); color: white; transform: rotate(90deg) scale(1.1); }

        .nature-pod {
            background: radial-gradient(circle at center, rgba(16, 185, 129, 0.05) 0%, transparent 70%);
            padding: 20px 10px 15px; text-align: center; margin-bottom: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .avatar-container { position: relative; display: inline-block; margin-bottom: 20px; min-height: 100px; width: 100%; }
        .forest-cluster { position: relative; display: flex; justify-content: center; align-items: flex-end; height: 100px; width: 100%; }
        
        .tree-base {
            font-size: 85px; position: relative; z-index: 5;
            animation: floatTree 4s ease-in-out infinite; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); line-height: 1;
        }
        .tree-extra { position: absolute; bottom: -5px; filter: drop-shadow(0 8px 10px rgba(0,0,0,0.6)) brightness(0.85); line-height: 1; }
        .tree-extra.withered { filter: grayscale(0.8) brightness(0.6) drop-shadow(0 5px 5px rgba(0,0,0,0.6)); }

        .extra-1 { right: 50%; margin-right: 25px; font-size: 65px; z-index: 4; animation: floatTree 4.5s ease-in-out infinite 0.5s; }
        .extra-2 { left: 50%; margin-left: 25px; font-size: 60px; z-index: 3; animation: floatTree 5s ease-in-out infinite 1s; }
        .extra-3 { right: 50%; margin-right: 55px; font-size: 50px; z-index: 2; animation: floatTree 5.5s ease-in-out infinite 1.5s; }
        .extra-4 { left: 50%; margin-left: 55px; font-size: 45px; z-index: 1; animation: floatTree 6s ease-in-out infinite 2s; }
        .extra-5 { right: 50%; margin-right: 75px; font-size: 40px; z-index: 0; animation: floatTree 6.5s ease-in-out infinite 2.5s; }

        @keyframes floatTree { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.02); } }

        .sparkle { position: absolute; font-size: 24px; color: #fbbf24; animation: blinkStar 1.5s ease-in-out infinite alternate; z-index: 10; pointer-events: none; filter: drop-shadow(0 0 8px rgba(251,191,36,0.6)); }
        .sparkle-1 { top: -10px; right: 20%; animation-delay: 0s; } .sparkle-2 { top: 35px; left: 15%; animation-delay: 0.5s; font-size: 18px; } .sparkle-3 { bottom: 15px; right: 10%; animation-delay: 1s; font-size: 20px; }
        @keyframes blinkStar { 0% { opacity: 0; transform: scale(0.5); } 50% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0; transform: scale(0.5); } }

        .weather-badge {
            position: absolute; bottom: -5px; right: 0; font-size: 12px; color: var(--leaf-green);
            background: rgba(0, 0, 0, 0.7); padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(52, 211, 153, 0.4);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); white-space: nowrap; display: flex; align-items: center; gap: 6px; font-weight: 600;
            z-index: 15; backdrop-filter: blur(10px); transform: translateX(15%);
        }

        .forest-tier-title {
            font-size: 18px; font-weight: 700; color: #fff; margin: 0; padding: 8px 18px;
            background: rgba(255,255,255,0.05); border-radius: 20px; border: 1px solid rgba(255,255,255,0.05);
        }

        .metrics-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .metric-card {
            background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 14px 15px; border-radius: 22px; display: flex; flex-direction: column; justify-content: center;
        }
        .metric-title { font-size: 11px; color: var(--text-dim); margin-bottom: 5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        .metric-value { font-size: 17px; font-weight: 700; color: #fff; }
        .metric-value.positive { color: var(--leaf-green); } .metric-value.negative { color: var(--danger-red); }
        
        .history-bar {
            display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.03); border-radius: 20px; padding: 12px 10px; margin-bottom: 20px; gap: 5px;
        }
        .history-item { text-align: center; border-right: 1px solid rgba(255,255,255,0.05); }
        .history-item:last-child { border-right: none; }
        .history-label { font-size: 10px; color: var(--text-dim); margin-bottom: 4px; }
        .history-val { font-size: 13px; font-weight: 600; color: #fff; }
        .history-val.positive { color: var(--leaf-green); } .history-val.negative { color: var(--danger-red); }

        .card-footer {
            font-size: 12px; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center;
            border-top: 1px dashed rgba(255, 255, 255, 0.1); padding-top: 15px; margin-top: auto;
        }
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background-color: currentColor; box-shadow: 0 0 8px currentColor; }

        .empty-forest {
            grid-column: 1 / -1; background: rgba(0,0,0,0.3); border: 2px dashed rgba(52, 211, 153, 0.2);
            padding: 80px 20px; border-radius: 40px; text-align: center; color: var(--text-dim); backdrop-filter: blur(10px);
        }
        
        #syncing-overlay {
            position: fixed; top: 20px; right: 20px; background: rgba(16, 185, 129, 0.2); border: 1px solid var(--leaf-green);
            color: var(--leaf-green); padding: 12px 25px; border-radius: 35px; font-size: 15px; z-index: 1000; font-weight: 600;
            backdrop-filter: blur(20px); box-shadow: 0 10px 30px rgba(0,0,0,0.4); display: none; transition: 0.3s;
        }
    </style>
</head>
<body>

    <div id="syncing-overlay">☁️ กำลังซิงค์ผืนป่าจากคลาวด์...</div>
    <div class="river-container"><div class="river-wave-track" id="riverTrack"></div></div>

    <div class="container">
        <div class="user-bar">
            <div class="badges-group">
                <div class="nature-badge">🌲 Living MT4 Forest Sanctuary</div>
                <div class="badge-item" id="season-badge">☀️ ฤดูกาล</div>
                <div class="badge-item" id="theme-badge">⏳ ตรวจสอบสภาพอากาศ...</div>
            </div>
        </div>

        <header>
            <h1>ป่าไม้แห่งการลงทุน</h1>
            <p class="subtitle">ระบบนิเวศ 3 ฤดูกาล และสภาพอากาศ Real-time อัจฉริยะ 🌟</p>
        </header>

        <div class="search-box-container">
            <input type="text" id="farmSearchInput" class="search-input" placeholder="🔍 ค้นหาแปลงฟาร์มด้วยเลขพอร์ต..." oninput="filterForestCards()">
        </div>

        <div class="summary-dashboard">
            <div class="summary-item"><div class="summary-label">💰 Total Balance</div><div class="summary-val" id="sum-balance">$0.00</div></div>
            <div class="summary-item"><div class="summary-label">💎 Total Equity</div><div class="summary-val" id="sum-equity">$0.00</div></div>
            <div class="summary-item"><div class="summary-label">📈 Floating P/L</div><div class="summary-val" id="sum-pl">$0.00</div></div>
            <div class="summary-item"><div class="summary-label">📊 Profit %</div><div class="summary-val" id="sum-percent">0.00%</div></div>
            <div class="summary-item"><div class="summary-label">🌲 รวมแปลงทั้งหมด</div><div class="summary-val" id="sum-farms" style="color: var(--leaf-green);">0 แปลง</div></div>
            <div class="summary-item"><div class="summary-label">🌱 รวมจำนวนต้น</div><div class="summary-val" id="sum-trees" style="color: var(--sun-gold);">0 ต้น</div></div>
        </div>

        <div class="control-box">
            <button class="btn-water" onclick="syncAndRefreshAll()"><span>💧 ซิงค์และโหลดข้อมูลฟาร์มทั้งหมด</span></button>
            <div class="auto-sync-container">
                <input type="checkbox" id="autoSyncCheck" onchange="toggleAutoSync()" style="accent-color: var(--leaf-green); transform: scale(1.3);">
                <label for="autoSyncCheck">รดน้ำอัตโนมัติ (ทุก 3 นาที)</label>
            </div>
        </div>

        <div id="forest-grid"></div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbytS0pOy1Vhaf7ZKAooZvDVkoJTVcFK4W4nsImNhqlODyKSQbLAu4ej9Ninr9WPs2JO/exec';
        
        let globalPortfolioData = {};
        let currentSeason = {};
        window.weatherParticles = ['🍃']; 
        
        // --- ☀️ ระบบ 3 ฤดูกาล (ฝน, หนาว, ร้อน) ---
        function getSeasonInfo() {
            const m = new Date().getMonth(); // 0=Jan ถึง 11=Dec
            // ฤดูหนาว: พ.ย. - ก.พ. (10, 11, 0, 1)
            if (m === 10 || m === 11 || m === 0 || m === 1) {
                return { name: 'ฤดูหนาว', icon: '❄️', defaultParticles: ['❄️', '⛄', '🌨️'], tint: 'rgba(56, 189, 248, 0.08)' };
            }
            // ฤดูร้อน: มี.ค. - พ.ค. (2, 3, 4)
            if (m >= 2 && m <= 4) {
                return { name: 'ฤดูร้อน', icon: '☀️', defaultParticles: ['☀️', '🍃', '✨'], tint: 'rgba(251, 191, 36, 0.08)' };
            }
            // ฤดูฝน: มิ.ย. - ต.ค. (5, 6, 7, 8, 9)
            return { name: 'ฤดูฝน', icon: '🌧️', defaultParticles: ['💧', '🌧️', '🍃'], tint: 'rgba(16, 185, 129, 0.1)' };
        }

        window.onload = async () => {
            initRiver();
            currentSeason = getSeasonInfo();
            document.getElementById('season-badge').innerHTML = `${currentSeason.icon} ${currentSeason.name}`;
            updateGlobalWeather(0); 
            startWeatherEffect();
            renderForest(); 
            await syncAndRefreshAll(); 
        };

        let autoSyncInterval;
        window.toggleAutoSync = function() {
            const isChecked = document.getElementById('autoSyncCheck').checked;
            const overlay = document.getElementById('syncing-overlay');
            if(isChecked) {
                autoSyncInterval = setInterval(syncAndRefreshAll, 3 * 60 * 1000);
                overlay.innerText = '⏱️ เปิดระบบรดน้ำอัตโนมัติแล้ว...'; overlay.style.display = 'block'; setTimeout(() => { overlay.style.display = 'none'; }, 2000);
            } else {
                clearInterval(autoSyncInterval);
                overlay.innerText = '⏸️ ปิดระบบรดน้ำอัตโนมัติ...'; overlay.style.display = 'block'; setTimeout(() => { overlay.style.display = 'none'; }, 2000);
            }
        };

        // --- 🌤️ ระบบสภาพอากาศ Real-time ---
        function updateGlobalWeather(totalPercent) {
            const hour = new Date().getHours();
            const root = document.documentElement;
            
            let themeName = 'อากาศดี 🍃';
            let bgColor = '#071911'; let cardBg = 'rgba(14, 38, 26, 0.75)';
            let bg1 = 'rgba(16, 185, 129, 0.18)'; let bg2 = 'rgba(5, 150, 105, 0.12)';
            let particles = currentSeason.defaultParticles;

            // 1. เช็คตามผลกำไรพอร์ต (Real-time Portfolio Weather)
            if (totalPercent <= -10) {
                themeName = 'พายุ/ลมแรง ⛈️';
                window.weatherParticles = ['💧', '🌧️', '🌪️', '⚡'];
                bgColor = '#1a0f0f'; cardBg = 'rgba(40, 20, 20, 0.85)';
                bg1 = 'rgba(248, 113, 113, 0.15)'; bg2 = 'rgba(0, 0, 0, 0.4)';
            } else if (totalPercent <= -2) {
                themeName = 'ฝนตก 🌧️';
                window.weatherParticles = ['💧', '🌧️', '🍃'];
            } else if (totalPercent >= 5) {
                themeName = 'รุ้งงาม 🌈';
                window.weatherParticles = ['✨', '🌈', '🦋', currentSeason.icon];
            } else {
                // 2. ถ้าพอร์ตปกติ เช็คสภาพอากาศตามช่วงเวลาของวัน
                if (hour >= 6 && hour < 9) {
                    themeName = 'แดดอ่อนๆ/โปร่ง 🌅';
                    window.weatherParticles = ['🍃', '☀️', '✨'];
                    bgColor = '#0a1f16'; cardBg = 'rgba(20, 45, 30, 0.75)';
                } else if (hour >= 9 && hour < 16) {
                    themeName = 'แดดจ้า ☀️';
                    window.weatherParticles = ['☀️', '🍃', '✨'];
                    bgColor = '#0d261b'; cardBg = 'rgba(22, 55, 38, 0.75)';
                } else if (hour >= 16 && hour < 19) {
                    themeName = 'ครึ้ม/ลมแรง ⛅';
                    window.weatherParticles = ['🍃', '🌾', '☁️'];
                    bgColor = '#141812'; cardBg = 'rgba(35, 25, 20, 0.75)';
                } else {
                    themeName = 'อากาศดี/สงบ 🌙';
                    window.weatherParticles = ['✨', '🌟', '🍃'];
                }
            }

            root.style.setProperty('--forest-dark', bgColor);
            root.style.setProperty('--forest-card', cardBg);
            document.body.style.backgroundImage = `
                radial-gradient(circle at 20% 10%, ${bg1} 0%, transparent 50%),
                radial-gradient(circle at 80% 90%, ${bg2} 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, ${currentSeason.tint} 0%, transparent 100%)
            `;
            
            document.getElementById('theme-badge').innerHTML = `สภาพอากาศ: ${themeName}`;
        }

        async function syncAndRefreshAll() {
            await syncFarmsFromCloud();
            const farms = getFarmsList();
            if(farms.length > 0) farms.forEach(login => fetchNodeData(login));
        }

        async function syncFarmsFromCloud() {
            const overlay = document.getElementById('syncing-overlay');
            overlay.innerText = '☁️ กำลังซิงค์ผืนป่าจากคลาวด์...'; overlay.style.display = 'block';
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getAllFarms`);
                const cloudFarms = await response.json();
                if(Array.isArray(cloudFarms)) {
                    let mergedFarms = [...new Set([...getFarmsList(), ...cloudFarms])];
                    saveFarmsList(mergedFarms); renderForest();
                }
            } catch(e) {}
            overlay.style.display = 'none';
        }

        function initRiver() { document.getElementById('riverTrack').innerHTML = '<div class="river-wave-item">🌊 💧 🌿 สายน้ำแห่งสภาพคล่องหล่อเลี้ยงผืนป่า 🌿 💧 🌊</div>'.repeat(6); }

        function startWeatherEffect() {
            setInterval(() => {
                const particle = document.createElement('div');
                particle.className = 'weather-particle';
                const icons = window.weatherParticles;
                const icon = icons[Math.floor(Math.random() * icons.length)];
                particle.innerText = icon;
                particle.style.left = Math.random() * window.innerWidth + 'px';
                
                if(['💧', '🌧️', '⚡', '❄️', '🌨️', '🌪️'].includes(icon)) {
                    particle.style.animationDuration = (Math.random() * 2 + 1.2) + 's'; particle.style.animationName = 'fallRain';
                } else {
                    particle.style.animationDuration = (Math.random() * 5 + 4) + 's'; particle.style.animationName = 'fallParticle';
                }
                
                particle.style.fontSize = (Math.random() * 12 + 14) + 'px';
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 8000);
            }, 800);
        }

        function getFarmsList() { return JSON.parse(localStorage.getItem('my_forest_farms') || '[]'); }
        function saveFarmsList(farms) { localStorage.setItem('my_forest_farms', JSON.stringify(farms)); }

        window.removeFarm = async function(login) {
            const confirmCode = prompt(`⚠️ กรุณากรอกรหัสยืนยันเพื่อลบพอร์ต:`);
            if (confirmCode === null || confirmCode.trim() !== String(login)) return alert('❌ รหัสยืนยันไม่ถูกต้อง!');
            
            const overlay = document.getElementById('syncing-overlay');
            overlay.innerText = `🔥 กำลังเผาถอนรากพอร์ต ${login}...`;
            overlay.style.backgroundColor = 'rgba(248, 113, 113, 0.2)'; overlay.style.color = 'var(--danger-red)'; overlay.style.display = 'block';
            try {
                await fetch(`${SCRIPT_URL}?action=deleteFarm&login=${login}`);
                let farms = getFarmsList().filter(f => f !== login); saveFarmsList(farms);
                delete globalPortfolioData[login]; updatePortfolioSummary(); renderForest(); 
            } catch(e) { alert('ข้อผิดพลาดการเชื่อมต่อ'); }
            overlay.style.display = 'none'; overlay.style.backgroundColor = 'rgba(16, 185, 129, 0.2)'; overlay.style.color = 'var(--leaf-green)';
        };

        function renderForest() {
            const grid = document.getElementById('forest-grid');
            grid.innerHTML = ''; const farms = getFarmsList();
            if (farms.length === 0) {
                grid.innerHTML = `<div class="empty-forest"><span style="font-size:60px; display:block; margin-bottom:20px;">🍃</span><h3 style="color:#fff; margin:0 0 10px; font-size: 24px;">ผืนป่ายังว่างเปล่า</h3><p style="margin:0; line-height: 1.6;">ระบบจะดึงพอร์ตมาสร้างอัตโนมัติเมื่อ EA ของคุณส่งข้อมูลเข้า Sheet</p></div>`;
                return;
            }

            farms.forEach(login => {
                const card = document.createElement('div'); card.className = 'tree-card'; card.setAttribute('data-login', login);
                card.innerHTML = `
                    <div class="card-header">
                        <div class="plot-number">🌲 #${login}<span id="stars-${login}" style="font-size:14px; margin-left:10px; color:#fbbf24; text-shadow:0 2px 4px rgba(251,191,36,0.3); letter-spacing:2px;"></span></div>
                        <button class="delete-btn" onclick="window.removeFarm('${login}')">✕</button>
                    </div>
                    <div class="nature-pod">
                        <div class="avatar-container" id="avatar-container-${login}">
                            <div class="tree-avatar">🌱</div><div class="weather-badge" id="weather-badge-${login}"><span>⏳</span> รอรับข้อมูล</div>
                        </div>
                        <div class="forest-tier-title" id="tier-${login}">กำลังหยั่งราก...</div>
                    </div>
                    <div class="metrics-container">
                        <div class="metric-card"><div class="metric-title">Balance</div><div class="metric-value" id="bal-${login}">$0.00</div></div>
                        <div class="metric-card"><div class="metric-title">Equity</div><div class="metric-value" id="eq-${login}">$0.00</div></div>
                        <div class="metric-card"><div class="metric-title">Floating P/L</div><div class="metric-value" id="pl-${login}">$0.00</div></div>
                        <div class="metric-card"><div class="metric-title">Orders (แยกไม้)</div><div class="metric-value" id="ord-${login}">0 ไม้</div></div>
                    </div>
                    <div class="history-bar">
                        <div class="history-item"><div class="history-label">วันนี้</div><div class="history-val" id="today-${login}">$0.00</div></div>
                        <div class="history-item"><div class="history-label">สัปดาห์นี้</div><div class="history-val" id="week-${login}">$0.00</div></div>
                        <div class="history-item"><div class="history-label">เดือนนี้</div><div class="history-val" id="month-${login}">$0.00</div></div>
                    </div>
                    <div class="card-footer">
                        <span id="status-${login}" style="color:var(--leaf-green); display:flex; align-items:center;"><span class="status-dot"></span> กำลังเชื่อมต่อผืนป่า</span>
                        <span id="time-${login}">--:--:--</span>
                    </div>`;
                grid.appendChild(card);
            });
            farms.forEach(login => { if (globalPortfolioData[login]) updateUICard(login); });
            updateTreeRanks(); filterForestCards();
        }

        async function fetchNodeData(login) {
            try {
                const response = await fetch(`${SCRIPT_URL}?login=${login}`); const data = await response.json();
                if (data.error || data.length === 0) { globalPortfolioData[login] = { error: true }; } 
                else {
                    const latest = data.at(-1); 
                    const balance = parseFloat(latest.balance); const profitLoss = parseFloat(latest.floating_pl);
                    globalPortfolioData[login] = { 
                        balance: balance, equity: parseFloat(latest.equity), profit: profitLoss,
                        percent: (balance > 0) ? (profitLoss / balance) * 100 : 0, open_positions: parseInt(latest.open_positions || 0), 
                        profit_orders: parseInt(latest.profit_orders || 0), loss_orders: parseInt(latest.loss_orders || 0),
                        profit_today: parseFloat(latest.profit_today || 0), profit_week: parseFloat(latest.profit_week || 0), profit_month: parseFloat(latest.profit_month || 0),
                        lastUpdated: latest.lastUpdated, error: false 
                    };
                }
                updatePortfolioSummary(); updateUICard(login); updateTreeRanks();
            } catch (err) { globalPortfolioData[login] = { error: true }; updateUICard(login); updateTreeRanks(); }
        }

        const formatMoney = (val) => { const absVal = Math.abs(val).toFixed(2); return val > 0 ? `+$${absVal}` : (val < 0 ? `-$${absVal}` : `$${absVal}`); };
        const formatPercent = (val) => { const absVal = Math.abs(val).toFixed(2); return val > 0 ? `(+${absVal}%)` : (val < 0 ? `(-${absVal}%)` : `(0.00%)`); };
        const getColorClass = (val) => val > 0 ? 'positive' : (val < 0 ? 'negative' : '');

        function updateUICard(login) {
            const data = globalPortfolioData[login]; if (!data) return;
            const statusDiv = document.getElementById(`status-${login}`); const weatherBadge = document.getElementById(`weather-badge-${login}`);
            if (!statusDiv) return;
            if (data.error) {
                statusDiv.innerHTML = '<span class="status-dot"></span> ขาดการติดต่อ'; statusDiv.style.color = 'var(--danger-red)';
                weatherBadge.innerHTML = '<span>⚠️</span> ข้อมูลขาดหาย'; weatherBadge.style.color = 'var(--danger-red)'; weatherBadge.style.borderColor = 'rgba(248, 113, 113, 0.4)'; return;
            }
            statusDiv.innerHTML = '<span class="status-dot"></span> ป่าไม้อุดมสมบูรณ์'; statusDiv.style.color = 'var(--leaf-green)';
            weatherBadge.style.color = 'var(--leaf-green)'; weatherBadge.style.borderColor = 'rgba(52, 211, 153, 0.4)';

            let emoji = '', txt = ''; const pct = data.percent;
            if (data.open_positions === 0) { emoji = '🏕️'; txt = 'ตั้งแคมป์รอจังหวะ'; weatherBadge.style.color = '#fbbf24'; weatherBadge.style.borderColor = 'rgba(251, 191, 36, 0.4)'; } 
            else if (pct > 15) { emoji = '🌈'; txt = 'รุ้งงามทอประกาย'; } else if (pct > 10) { emoji = '☀️'; txt = 'แดดจ้าอบอุ่น'; } 
            else if (pct > 5) { emoji = '🌤️'; txt = 'เมฆโปร่งบางส่วน'; } else if (pct > 0) { emoji = '⛅'; txt = 'อากาศดี ร่มรื่น'; } 
            else if (pct === 0) { emoji = '🌫️'; txt = 'สงบเงียบ'; } else if (pct >= -5) { emoji = '🌧️'; txt = 'ฝนตกปรอยๆ'; } 
            else if (pct >= -10) { emoji = '☔'; txt = 'ฝนตกหนัก'; weatherBadge.style.color = '#fbbf24'; weatherBadge.style.borderColor = 'rgba(251,191,36,0.4)'; } 
            else { emoji = '⛈️'; txt = 'พายุ / ฟ้าร้อง!'; weatherBadge.style.color = 'var(--danger-red)'; weatherBadge.style.borderColor = 'rgba(248,113,113,0.4)'; }

            weatherBadge.innerHTML = `<span>${emoji}</span> ${txt}`;
            document.getElementById(`bal-${login}`).innerText = `$${data.balance.toFixed(2)}`; document.getElementById(`eq-${login}`).innerText = `$${data.equity.toFixed(2)}`;
            const plDiv = document.getElementById(`pl-${login}`); plDiv.className = `metric-value ${getColorClass(data.profit)}`; plDiv.innerText = `${formatMoney(data.profit)} ${formatPercent(pct)}`;
            document.getElementById(`ord-${login}`).innerHTML = `<span style="color:var(--leaf-green)">🟢 ${data.profit_orders}</span> | <span style="color:var(--danger-red)">🔴 ${data.loss_orders}</span>`;
            
            ['today', 'week', 'month'].forEach(t => {
                const val = data[`profit_${t}`]; const div = document.getElementById(`${t}-${login}`);
                div.innerText = formatMoney(val); div.className = `history-val ${getColorClass(val)}`;
            });
            document.getElementById(`time-${login}`).innerText = new Date(data.lastUpdated).toLocaleTimeString('th-TH');
        }

        function updateTreeRanks() {
            const farms = Object.keys(globalPortfolioData).filter(f => !globalPortfolioData[f].error);
            if (farms.length === 0) return;
            let minEq = Infinity, maxEq = -Infinity, maxPercent = 0;
            farms.forEach(f => {
                const d = globalPortfolioData[f];
                if (d.open_positions >= 1) { if (d.equity < minEq) minEq = d.equity; if (d.equity > maxEq) maxEq = d.equity; }
                if (d.percent > maxPercent) maxPercent = d.percent;
            });
            if(minEq === Infinity) { minEq = 0; maxEq = 0; }

            farms.forEach(f => {
                const data = globalPortfolioData[f]; const avatarContainer = document.getElementById(`avatar-container-${f}`); const tierDiv = document.getElementById(`tier-${f}`);
                const starsSpan = document.getElementById(`stars-${f}`); const weatherBadge = document.getElementById(`weather-badge-${f}`);
                if (!avatarContainer || !tierDiv) return;
                let badgeHTML = weatherBadge ? weatherBadge.outerHTML : '';

                if (data.open_positions === 0) {
                    // 🔥 กองไฟอยู่ซ้ายมือของเต็นท์
                    avatarContainer.innerHTML = `
                        <div class="forest-cluster">
                            <div class="tree-extra" style="font-size: 38px; position: absolute; left: 50%; transform: translateX(-120%); bottom: 0px; z-index: 6; filter: drop-shadow(0 0 15px rgba(251, 146, 60, 0.9));">🔥</div>
                            <div class="tree-base" style="font-size: 80px; animation: none; position: relative; z-index: 5; margin-left: 25px;">🏕️</div>
                        </div>` + badgeHTML;
                    tierDiv.innerText = 'แคมป์พักแรมรอออเดอร์';
                } else {
                    let level = (maxEq > minEq) ? Math.floor(((data.equity - minEq) / (maxEq - minEq)) * 9) + 1 : 10;
                    if (data.balance <= 0) level = 0;
                    const names = ['เมล็ดพันธุ์ในดิน','ต้นกล้าแรกแย้ม','ไม้ประดับกระถาง','พุ่มไม้ใบอ่อน','พุ่มไม้เขียวขจี','กอไผ่ตั้งตรง','ต้นปาล์มพลิ้วไหว','ไม้ผลัดใบให้ร่มเงา','ต้นสนสูงตระหง่าน','พฤกษาแกร่งทนทาน','มหาพฤกษาโบราณ'];
                    const emojis = ['🌰','🌱','🪴','🌿','☘️','🎋','🌴','🌳','🌲','🌵','🪵'];
                    let treeEmoji = emojis[level]; let treeName = `${names[level]} (Level ${level})`;
                    
                    let clusterHTML = `<div class="forest-cluster"><div class="tree-base">${treeEmoji}</div>`;
                    let extraHealthy = Math.min(Math.floor(data.percent / 10) || (data.profit_orders > 0 ? 1 : 0), 3);
                    let extraWithered = Math.min(data.loss_orders, 2);
                    let pos = 1;
                    for(let i=0; i<extraHealthy; i++) { clusterHTML += `<div class="tree-extra extra-${pos}">${treeEmoji}</div>`; pos++; }
                    for(let i=0; i<extraWithered; i++) { clusterHTML += `<div class="tree-extra extra-${pos} withered">🥀</div>`; pos++; }
                    clusterHTML += `<span class="sparkle sparkle-1">✨</span><span class="sparkle sparkle-2">✨</span><span class="sparkle sparkle-3">✨</span></div>`;
                    
                    avatarContainer.innerHTML = clusterHTML + badgeHTML; tierDiv.innerText = treeName;
                }

                if (starsSpan) {
                    let starsCount = (data.percent > 0 && maxPercent > 0 && data.open_positions > 0) ? Math.max(1, Math.min(5, Math.ceil((data.percent / maxPercent) * 5))) : 0;
                    starsSpan.innerText = '⭐'.repeat(starsCount);
                }
            });
            autoSortForestCards();
        }

        function autoSortForestCards() {
            const grid = document.getElementById('forest-grid'); const cards = Array.from(grid.getElementsByClassName('tree-card'));
            cards.sort((a, b) => {
                const dA = globalPortfolioData[a.getAttribute('data-login')], dB = globalPortfolioData[b.getAttribute('data-login')];
                return (dB && !dB.error ? dB.percent : -999999) - (dA && !dA.error ? dA.percent : -999999);
            });
            cards.forEach((card, i) => { card.style.order = i; grid.appendChild(card); });
        }

        function filterForestCards() {
            const query = document.getElementById('farmSearchInput').value.toLowerCase().trim();
            Array.from(document.getElementsByClassName('tree-card')).forEach(c => c.style.display = c.getAttribute('data-login').toLowerCase().includes(query) ? 'flex' : 'none');
        }

        function updatePortfolioSummary() {
            let tb = 0, te = 0, tp = 0, tTrees = 0;
            getFarmsList().forEach(login => {
                const d = globalPortfolioData[login]; if (d && !d.error) { tb += d.balance; te += d.equity; tp += d.profit; tTrees += d.open_positions; }
            });
            document.getElementById('sum-balance').innerText = `$${tb.toFixed(2)}`; document.getElementById('sum-equity').innerText = `$${te.toFixed(2)}`;
            const plElem = document.getElementById('sum-pl'); plElem.className = 'summary-val ' + getColorClass(tp); plElem.innerText = formatMoney(tp);
            const totalPercent = (tb > 0) ? (tp / tb) * 100 : 0;
            const percentElem = document.getElementById('sum-percent'); percentElem.className = 'summary-val ' + getColorClass(totalPercent); percentElem.innerText = (totalPercent > 0 ? '+' : '') + totalPercent.toFixed(2) + '%';
            document.getElementById('sum-farms').innerText = `${getFarmsList().length} แปลง`; document.getElementById('sum-trees').innerText = `${tTrees} ต้น`;
            updateGlobalWeather(totalPercent);
        }
    </script>
</body>
</html>
