<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ป่าไม้แห่งการลงทุน - Living Forest</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --forest-dark: #071911;
            --forest-card: rgba(14, 38, 26, 0.85);
            --forest-border: rgba(52, 211, 153, 0.25);
            --leaf-green: #34d399;
            --leaf-glow: rgba(52, 211, 153, 0.4);
            --text-light: #ecfdf5;
            --text-dim: #9ca3af;
            --danger-red: #f87171;
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--forest-dark);
            background-image: 
                radial-gradient(circle at 20% 10%, rgba(16, 185, 129, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 80% 90%, rgba(5, 150, 105, 0.12) 0%, transparent 40%);
            color: var(--text-light);
            margin: 0; padding: 40px 20px 100px 20px;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 🌊 สายน้ำไหล */
        .river-container {
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 50px;
            background: linear-gradient(180deg, rgba(4, 47, 46, 0.4) 0%, rgba(2, 44, 34, 0.95) 100%);
            border-top: 2px solid rgba(52, 211, 153, 0.3);
            z-index: 999;
            box-shadow: 0 -10px 30px rgba(52, 211, 153, 0.25);
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .river-wave-track {
            display: flex;
            white-space: nowrap;
            animation: flowRiver 12s linear infinite;
        }
        .river-wave-item {
            font-size: 16px;
            font-weight: 500;
            color: #6ee7b7;
            padding-right: 40px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.6);
        }
        @keyframes flowRiver {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* 🍃 ใบไม้ปลิว */
        .falling-leaf {
            position: fixed;
            top: -50px;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: fallLeaf linear infinite;
        }
        @keyframes fallLeaf {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.9; }
            100% { transform: translateY(105vh) translateX(120px) rotate(360deg); opacity: 0; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--forest-card);
            border: 1px solid var(--forest-border);
            padding: 12px 25px;
            border-radius: 20px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        .nature-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(52, 211, 153, 0.12);
            color: var(--leaf-green);
            padding: 8px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--forest-border);
        }

        h1 {
            font-size: 40px;
            font-weight: 700;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #ffffff 0%, #6ee7b7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        p.subtitle { color: var(--text-dim); font-size: 15px; margin: 0; }

        /* 📊 แถบรวมยอด */
        .summary-dashboard {
            background: var(--forest-card);
            border: 1px solid var(--forest-border);
            border-radius: 24px;
            padding: 20px 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(15px);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .summary-item { text-align: center; border-right: 1px solid rgba(255, 255, 255, 0.08); }
        .summary-item:last-child { border-right: none; }
        .summary-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; font-weight: 500; }
        .summary-val { font-size: 20px; font-weight: 700; color: #fff; }
        .summary-val.positive { color: var(--leaf-green); }
        .summary-val.negative { color: var(--danger-red); }

        /* ส่วนควบคุมปุ่มกด */
        .control-box {
            background: var(--forest-card);
            backdrop-filter: blur(15px);
            border: 1px solid var(--forest-border);
            padding: 18px 28px;
            border-radius: 24px;
            display: inline-flex;
            gap: 15px;
            margin-bottom: 35px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        input[type="text"] {
            background: rgba(6, 23, 15, 0.85);
            border: 1px solid rgba(52, 211, 153, 0.25);
            padding: 14px 20px 14px 45px;
            border-radius: 16px;
            color: white;
            font-size: 15px;
            font-family: inherit;
            width: 270px;
            outline: none;
        }
        input[type="text"]:focus { border-color: var(--leaf-green); box-shadow: 0 0 0 4px var(--leaf-glow); }
        .input-icon { position: absolute; left: 16px; font-size: 18px; pointer-events: none; }
        .btn {
            padding: 14px 28px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 15px;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: none;
        }
        .btn-plant { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #fff; }
        .btn-plant:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5); }
        .btn-water { background: rgba(255, 255, 255, 0.06); color: var(--text-light); border: 1px solid rgba(255, 255, 255, 0.12); }
        .btn-water:hover { background: rgba(255, 255, 255, 0.12); transform: translateY(-2px); }

        #forest-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 30px;
        }

        /* 🌳 การ์ดต้นไม้ */
        .tree-card {
            background: var(--forest-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--forest-border);
            border-radius: 30px;
            padding: 30px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            transform-origin: bottom center;
            animation: breezeSway 6s ease-in-out infinite;
        }
        @keyframes breezeSway {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(0.8deg) translateY(-2px); }
        }
        .tree-card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, transparent, var(--leaf-green), transparent);
            opacity: 0.7;
        }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .plot-number { font-size: 22px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
        .delete-btn {
            background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.25);
            color: var(--danger-red); width: 36px; height: 36px; border-radius: 12px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px;
        }
        .delete-btn:hover { background: var(--danger-red); color: white; }

        /* ------------------ อัปเกรดเลย์เอาต์กราฟิก 3D ------------------ */
        .nature-pod {
            background: rgba(6, 23, 15, 0.6);
            border: 1px solid rgba(52, 211, 153, 0.15);
            border-radius: 22px;
            padding: 25px 20px;
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }

        .avatar-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 12px;
        }

        /* กล่องใส่รูปต้นไม้ 3D */
        .tree-avatar {
            width: 95px;
            height: 95px;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.4));
            animation: floatTree 3.5s ease-in-out infinite;
            transform-origin: bottom center;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
        }
        .tree-avatar img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* กล่องใส่รูปสภาพอากาศ 3D (ลอยมุมขวาบน) */
        .weather-icon {
            position: absolute;
            top: -15px;
            right: -30px;
            width: 48px;
            height: 48px;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.5));
            animation: floatWeather 4s ease-in-out infinite alternate;
            z-index: 2;
        }
        .weather-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @keyframes floatTree {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(-2deg); }
        }
        @keyframes floatWeather {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-6px) rotate(8deg); }
        }

        /* ชื่อต้นไม้ และ คำบรรยาย */
        .forest-tier-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin: 0 0 10px 0;
        }
        .forest-weather {
            font-size: 12px;
            color: var(--leaf-green);
            background: rgba(52, 211, 153, 0.12);
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid rgba(52, 211, 153, 0.25);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            font-weight: 500;
        }

        /* ----------------------------------------------------------- */

        .metrics-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .metric-card { background: rgba(6, 23, 15, 0.5); border: 1px solid rgba(255, 255, 255, 0.04); padding: 14px 16px; border-radius: 16px; }
        .metric-title { font-size: 11px; color: var(--text-dim); margin-bottom: 5px; text-transform: uppercase; }
        .metric-value { font-size: 16px; font-weight: 700; color: #fff; }
        .metric-value.positive { color: var(--leaf-green); }
        .metric-value.negative { color: var(--danger-red); }
        .card-footer { font-size: 12px; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255, 255, 255, 0.06); padding-top: 15px; }
        
        .empty-forest { grid-column: 1 / -1; background: var(--forest-card); border: 1px dashed var(--forest-border); padding: 60px; border-radius: 30px; text-align: center; color: var(--text-dim); }
        .empty-forest img { width: 80px; margin-bottom: 15px; animation: floatTree 3s ease-in-out infinite; }
    </style>
</head>
<body>

    <!-- สายน้ำไหล -->
    <div class="river-container">
        <div class="river-wave-track" id="riverTrack"></div>
    </div>

    <div class="container">
        <div class="user-bar">
            <div class="nature-badge">🌲 Living MT4 Forest Sanctuary</div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <span style="color: var(--leaf-green); font-weight: 600;">🌿 สวนป่าส่วนตัวของคุณ</span>
            </div>
        </div>

        <header>
            <h1>ป่าไม้แห่งการลงทุน</h1>
            <p class="subtitle">จำลองสายลม สายน้ำ และสภาพอากาศ 3D เคลื่อนไหวเฉพาะพอร์ตของคุณ</p>
        </header>

        <!-- แถบรวมยอด -->
        <div class="summary-dashboard">
            <div class="summary-item">
                <div class="summary-label">Total Balance</div>
                <div class="summary-val" id="sum-balance">$0.00</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">Total Equity</div>
                <div class="summary-val" id="sum-equity">$0.00</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">Total Floating P/L</div>
                <div class="summary-val" id="sum-pl">$0.00</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">Total Farms</div>
                <div class="summary-val" id="sum-farms" style="color: var(--leaf-green);">0 แปลง</div>
            </div>
        </div>

        <div style="text-align: center;">
            <div class="control-box">
                <div class="input-wrapper">
                    <span class="input-icon">🌱</span>
                    <input type="text" id="loginId" placeholder="ระบุเลขพอร์ต MT4...">
                </div>
                <button class="btn btn-plant" onclick="addFarm()">
                    <span>🌲 ปลูกต้นไม้ใหม่</span>
                </button>
                <button class="btn btn-water" onclick="refreshAll()">
                    <span>💧 รดน้ำซิงค์ข้อมูล</span>
                </button>
            </div>
        </div>

        <div id="forest-grid"></div>
    </div>

    <script>
        // ลิงก์เชื่อมต่อ Google Sheet ของคุณ
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbytS0pOy1Vhaf7ZKAooZvDVkoJTVcFK4W4nsImNhqlODyKSQbLAu4ej9Ninr9WPs2JO/exec';
        
        let globalPortfolioData = {};

        window.onload = () => {
            initRiver();
            startWindEffect();
            renderForest();
            refreshAll(); 
        };

        function initRiver() {
            const track = document.getElementById('riverTrack');
            const content = '<div class="river-wave-item">🌊 💧 🌿 สายน้ำแห่งสภาพคล่องหล่อเลี้ยงผืนป่า 🌿 💧 🌊</div>';
            track.innerHTML = content.repeat(6);
        }

        function startWindEffect() {
            setInterval(() => {
                const leaf = document.createElement('div');
                leaf.className = 'falling-leaf';
                const icons = ['🍃', '🍂', '✨', '🌿'];
                leaf.innerText = icons[Math.floor(Math.random() * icons.length)];
                leaf.style.left = Math.random() * window.innerWidth + 'px';
                leaf.style.animationDuration = (Math.random() * 5 + 4) + 's';
                leaf.style.fontSize = (Math.random() * 10 + 14) + 'px';
                document.body.appendChild(leaf);
                setTimeout(() => leaf.remove(), 9000);
            }, 1200);
        }

        function getFarmsList() { 
            return JSON.parse(localStorage.getItem('my_forest_farms') || '[]'); 
        }
        
        function saveFarmsList(farms) { 
            localStorage.setItem('my_forest_farms', JSON.stringify(farms)); 
        }

        function addFarm() {
            const loginInput = document.getElementById('loginId');
            const login = loginInput.value.trim();
            if (!login) { alert('กรุณากรอกเลขพอร์ต MT4 ครับ'); return; }
            
            let farms = getFarmsList();
            if (farms.includes(login)) { alert('พอร์ตนี้ถูกปลูกไว้ในป่าของคุณแล้วครับ'); return; }
            
            farms.push(login);
            saveFarmsList(farms);
            loginInput.value = '';
            renderForest();
            fetchNodeData(login);
        }

        window.removeFarm = function(login) {
            if(confirm(`ต้องการถอนต้นไม้พอร์ต ${login} ออกจากผืนป่าของคุณใช่หรือไม่?`)) {
                let farms = getFarmsList();
                farms = farms.filter(f => f !== login);
                saveFarmsList(farms);
                delete globalPortfolioData[login];
                updatePortfolioSummary();
                renderForest();
            }
        };

        function renderForest() {
            const grid = document.getElementById('forest-grid');
            grid.innerHTML = '';
            const farms = getFarmsList();

            if (farms.length === 0) {
                grid.innerHTML = `
                    <div class="empty-forest">
                        <img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Leaf%20fluttering%20in%20wind/3D/leaf_fluttering_in_wind_3d.png" alt="Empty">
                        <h3 style="color:#fff; margin:0 0 5px 0; font-size: 20px;">ผืนป่ายังว่างเปล่า</h3>
                        <p style="margin:0;">พิมพ์เลขพอร์ต MT4 ด้านบน แล้วกด "ปลูกต้นไม้ใหม่" เพื่อเริ่มสร้างระบบนิเวศน์ส่วนตัวของคุณ</p>
                    </div>
                `;
                updatePortfolioSummary();
                return;
            }

            farms.forEach(login => {
                const card = document.createElement('div');
                card.className = 'tree-card';
                // วางโครงสร้างเพื่อรอใส่ภาพ 3D
                card.innerHTML = `
                    <div class="card-header">
                        <div class="plot-number">🌲 #${login}</div>
                        <button class="delete-btn" onclick="window.removeFarm('${login}')" title="ถอนต้นไม้">✕</button>
                    </div>

                    <div class="nature-pod">
                        <div class="avatar-wrapper">
                            <!-- จุดแสดงต้นไม้ 3D -->
                            <div class="tree-avatar" id="avatar-${login}">
                                <img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Seedling/3D/seedling_3d.png" style="opacity: 0.5;">
                            </div>
                            <!-- จุดแสดงสภาพอากาศ 3D มุมขวาบน -->
                            <div class="weather-icon" id="weather-icon-${login}">
                                <img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Hourglass%20not%20done/3D/hourglass_not_done_3d.png">
                            </div>
                        </div>
                        <div class="forest-tier-title" id="tier-${login}">กำลังหยั่งราก...</div>
                        <div class="forest-weather" id="weather-desc-${login}">⏳ รอรับสภาพอากาศ</div>
                    </div>

                    <div class="metrics-container">
                        <div class="metric-card">
                            <div class="metric-title">Initial Balance</div>
                            <div class="metric-value" id="bal-${login}">$0.00</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-title">Current Equity</div>
                            <div class="metric-value" id="eq-${login}">$0.00</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-title">Floating P/L</div>
                            <div class="metric-value" id="pl-${login}">$0.00</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-title">Active Orders</div>
                            <div class="metric-value" id="ord-${login}">0 แปลง</div>
                        </div>
                    </div>

                    <div class="card-footer">
                        <span id="status-${login}" style="color: var(--leaf-green);">● กำลังเชื่อมต่อผืนป่า</span>
                        <span id="time-${login}">--:--:--</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function refreshAll() {
            const farms = getFarmsList();
            if(farms.length > 0) {
                farms.forEach(login => fetchNodeData(login));
            }
        }

        async function fetchNodeData(login) {
            const avatarDiv = document.getElementById(`avatar-${login}`);
            const weatherIconDiv = document.getElementById(`weather-icon-${login}`);
            const tierDiv = document.getElementById(`tier-${login}`);
            const weatherDescDiv = document.getElementById(`weather-desc-${login}`);
            const statusDiv = document.getElementById(`status-${login}`);
            
            const balDiv = document.getElementById(`bal-${login}`);
            const eqDiv = document.getElementById(`eq-${login}`);
            const plDiv = document.getElementById(`pl-${login}`);
            const ordDiv = document.getElementById(`ord-${login}`);
            const timeDiv = document.getElementById(`time-${login}`);

            if(!avatarDiv) return;

            try {
                const response = await fetch(`${SCRIPT_URL}?login=${login}`);
                const data = await response.json();

                if (data.error || data.length === 0) {
                    statusDiv.innerHTML = '● ขาดการติดต่อ';
                    statusDiv.style.color = 'var(--danger-red)';
                    tierDiv.innerText = 'ดินแห้งแล้ง';
                    
                    // รูป 3D เมื่อเกิด Error
                    avatarDiv.innerHTML = '<img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Fallen%20leaf/3D/fallen_leaf_3d.png">';
                    weatherIconDiv.innerHTML = '<img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Warning/3D/warning_3d.png">';
                    weatherDescDiv.innerText = '⚠️ ข้อมูลขาดหาย';
                    
                    globalPortfolioData[login] = { balance: 0, equity: 0, profit: 0 };
                    updatePortfolioSummary();
                    return;
                }

                const latest = data[0];
                const balance = parseFloat(latest.balance);
                const equity = parseFloat(latest.equity);
                const profitLoss = parseFloat(latest.floating_pl);
                const openPositions = parseInt(latest.open_positions || 0);
                
                globalPortfolioData[login] = { balance: balance, equity: equity, profit: profitLoss };
                updatePortfolioSummary();

                const diff = equity - balance;
                const percent = (balance > 0) ? (diff / balance) * 100 : 0;

                statusDiv.innerHTML = '● ป่าไม้อุดมสมบูรณ์';
                statusDiv.style.color = 'var(--leaf-green)';

                // 🌳 ระบบรูประดับต้นไม้ 3D
                let treeImgUrl = '';
                let treeName = '';
                
                if (balance <= 0) {
                    treeImgUrl = 'https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Wood/3D/wood_3d.png'; 
                    treeName = 'ที่ดินเปล่า (Empty Land)';
                } else if (equity >= 20000) {
                    treeImgUrl = 'https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Christmas%20tree/3D/christmas_tree_3d.png';
                    treeName = 'ต้นไม้ผลดกมั่งคั่ง (Golden Tree)';
                } else if (equity >= 10000) {
                    treeImgUrl = 'https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Evergreen%20tree/3D/evergreen_tree_3d.png';
                    treeName = 'มหาพฤกษาใหญ่ (Ancient Giant)';
                } else if (equity >= 5000) {
                    treeImgUrl = 'https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Deciduous%20tree/3D/deciduous_tree_3d.png';
                    treeName = 'ต้นไม้ร่มรื่น (Mature Tree)';
                } else if (equity >= 2000) {
                    treeImgUrl = 'https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Herb/3D/herb_3d.png';
                    treeName = 'พุ่มไม้เขียวขจี (Growing Bush)';
                } else if (equity >= 1000) {
                    treeImgUrl = 'https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Potted%20plant/3D/potted_plant_3d.png';
                    treeName = 'ไม้ประดับในกระถาง (Pot Plant)';
                } else {
                    treeImgUrl = 'https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Seedling/3D/seedling_3d.png';
                    treeName = 'ต้นกล้าเล็กๆ (Sprout)';
                }

                // ☀️ ระบบรูปสภาพอากาศ 3D 10 ระดับ
                let weatherImgUrl = '';
                let weatherText = '';
                
                if (balance <= 0) {
                    weatherImgUrl = 'https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Construction/3D/construction_3d.png'; 
                    weatherText = '🚧 รอดำเนินการหว่านเมล็ดพันธุ์';
                } else if (percent > 15) {
                    weatherImgUrl = 'https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Rainbow/3D/rainbow_3d.png'; 
                    weatherText = '🌈 ท้องฟ้าสดใส รุ้งงามทอประกาย';
                } else if (percent > 10 && percent <= 15) {
                    weatherImgUrl = 'https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Sun/3D/sun_3d.png'; 
                    weatherText = '☀️ แดดออกอบอุ่น ลมพัดเย็นสบาย';
                } else if (percent > 5 && percent <= 10) {
                    weatherImgUrl = 'https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Sun%20behind%20small%20cloud/3D/sun_behind_small_cloud_3d.png'; 
                    weatherText = '🌤️ ท้องฟ้าแจ่มใส มีเมฆประดับบางส่วน';
                } else if (percent > 0 && percent <= 5) {
                    weatherImgUrl = 'https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Cloud/3D/cloud_3d.png'; 
                    weatherText = '⛅ ร่มรื่น แดดอ่อนๆ สบายตัว';
                } else if (percent === 0) {
                    weatherImgUrl = 'https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Fog/3D/fog_3d.png'; 
                    weatherText = '🌫️ หมอกจางๆ ยามเช้า สงบเงียบ';
                } else if (percent < 0 && percent >= -5) {
                    weatherImgUrl = 'https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Droplet/3D/droplet_3d.png'; 
                    weatherText = '🌧️ ฝนตกปรอยๆ ลมเริ่มพัดแรง';
                } else if (percent < -5 && percent >= -10) {
                    weatherImgUrl = 'https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Cloud%20with%20rain/3D/cloud_with_rain_3d.png'; 
                    weatherText = '☔ ฝนตกชุก สภาพอากาศแปรปรวน';
                } else if (percent < -10 && percent >= -15) {
                    weatherImgUrl = 'https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Cloud%20with%20lightning%20and%20rain/3D/cloud_with_lightning_and_rain_3d.png'; 
                    weatherText = '⛈️ พายุฝนฟ้าคะนองรุนแรง!';
                } else if (percent < -15) {
                    weatherImgUrl = 'https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Tornado/3D/tornado_3d.png'; 
                    weatherText = '🌪️ พายุทอร์นาโดเข้าถล่มป่า!';
                }

                // สั่งแสดงผลภาพลงเว็บ
                avatarDiv.innerHTML = `<img src="${treeImgUrl}">`;
                tierDiv.innerText = treeName;
                weatherIconDiv.innerHTML = `<img src="${weatherImgUrl}">`;
                weatherDescDiv.innerText = weatherText;

                balDiv.innerText = `$${balance.toFixed(2)}`;
                eqDiv.innerText = `$${equity.toFixed(2)}`;

                const plClass = profitLoss < 0 ? 'negative' : (profitLoss > 0 ? 'positive' : '');
                const plPrefix = profitLoss > 0 ? '+' : '';
                plDiv.className = `metric-value ${plClass}`;
                plDiv.innerText = `${plPrefix}$${profitLoss.toFixed(2)} (${plPrefix}${percent.toFixed(2)}%)`;

                ordDiv.innerText = `${openPositions} แปลง`;
                timeDiv.innerText = new Date(latest.lastUpdated).toLocaleTimeString('th-TH');

            } catch (err) {
                statusDiv.innerHTML = '● ระบบขัดข้อง';
                statusDiv.style.color = 'var(--danger-red)';
                tierDiv.innerText = 'ดินแห้งแล้ง';
                
                avatarDiv.innerHTML = '<img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Fallen%20leaf/3D/fallen_leaf_3d.png">';
                weatherIconDiv.innerHTML = '<img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Warning/3D/warning_3d.png">';
                weatherDescDiv.innerText = '⚠️ ภัยแล้งชั่วคราว';
            }
        }

        function updatePortfolioSummary() {
            let totalBalance = 0;
            let totalEquity = 0;
            let totalProfit = 0;
            const farms = getFarmsList();

            farms.forEach(login => {
                if (globalPortfolioData[login]) {
                    totalBalance += globalPortfolioData[login].balance || 0;
                    totalEquity += globalPortfolioData[login].equity || 0;
                    totalProfit += globalPortfolioData[login].profit || 0;
                }
            });

            document.getElementById('sum-balance').innerText = `$${totalBalance.toFixed(2)}`;
            document.getElementById('sum-equity').innerText = `$${totalEquity.toFixed(2)}`;
            
            const plElem = document.getElementById('sum-pl');
            const plPrefix = totalProfit > 0 ? '+' : '';
            plElem.className = 'summary-val ' + (totalProfit > 0 ? 'positive' : (totalProfit < 0 ? 'negative' : ''));
            plElem.innerText = `${plPrefix}$${totalProfit.toFixed(2)}`;

            document.getElementById('sum-farms').innerText = `${farms.length} แปลง`;
        }
    </script>
</body>
</html>
