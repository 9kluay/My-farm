<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ป่าไม้แห่งการลงทุน - Multi-User Living Forest</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --forest-dark: #071911;
            --forest-card: rgba(14, 38, 26, 0.85);
            --forest-border: rgba(52, 211, 153, 0.25);
            --leaf-green: #34d399;
            --leaf-glow: rgba(52, 211, 153, 0.4);
            --text-light: #ecfdf5;
            --text-dim: #9ca3af;
            --danger-red: #f87171;
            --sun-gold: #fbbf24;
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--forest-dark);
            background-image: 
                radial-gradient(circle at 20% 10%, rgba(16, 185, 129, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 80% 90%, rgba(5, 150, 105, 0.12) 0%, transparent 40%);
            color: var(--text-light);
            margin: 0; padding: 40px 20px 100px 20px;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 🌊 เอฟเฟกต์สายน้ำไหลด้านล่างสุด */
        .river-container {
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 50px;
            background: linear-gradient(180deg, rgba(4, 47, 46, 0.4) 0%, rgba(2, 44, 34, 0.95) 100%);
            border-top: 2px solid rgba(52, 211, 153, 0.3);
            z-index: 999;
            box-shadow: 0 -10px 30px rgba(52, 211, 153, 0.25);
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .river-wave-track {
            display: flex;
            white-space: nowrap;
            animation: flowRiver 12s linear infinite;
        }

        .river-wave-item {
            font-size: 16px;
            font-weight: 500;
            color: #6ee7b7;
            padding-right: 40px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.6);
        }

        @keyframes flowRiver {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* 🍃 เอฟเฟกต์ลมพัดใบไม้ปลิว */
        .falling-leaf {
            position: fixed;
            top: -50px;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: fallLeaf linear infinite;
        }
        @keyframes fallLeaf {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.9; }
            100% { transform: translateY(105vh) translateX(120px) rotate(360deg); opacity: 0; }
        }

        /* ------------------ หน้าจอเข้าสู่ระบบ / ลงทะเบียน ------------------ */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(7, 25, 17, 0.97);
            backdrop-filter: blur(25px);
            display: flex; justify-content: center; align-items: center;
            z-index: 99999;
        }

        .auth-box {
            background: var(--forest-card);
            border: 1px solid var(--forest-border);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            max-width: 420px; width: 90%;
            animation: floatLock 4s ease-in-out infinite;
        }
        @keyframes floatLock {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .auth-box h2 {
            margin-top: 0;
            color: #fff;
            font-size: 24px;
        }

        .auth-box p {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .auth-input {
            background: rgba(6, 23, 15, 0.9);
            border: 1px solid rgba(52, 211, 153, 0.3);
            padding: 14px 20px;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            width: 100%;
            outline: none;
            margin-bottom: 15px;
            font-family: inherit;
        }

        .auth-input:focus {
            border-color: var(--leaf-green);
            box-shadow: 0 0 0 4px var(--leaf-glow);
        }

        .tab-switch {
            display: flex;
            background: rgba(6, 23, 15, 0.6);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-weight: 600;
            cursor: pointer;
            border-radius: 10px;
            font-family: inherit;
        }

        .tab-btn.active {
            background: var(--leaf-green);
            color: #064e3b;
            box-shadow: 0 4px 15px rgba(52, 211, 153, 0.4);
        }

        /* ------------------ โครงสร้างหลัก ------------------ */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--forest-card);
            border: 1px solid var(--forest-border);
            padding: 12px 25px;
            border-radius: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .nature-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(52, 211, 153, 0.12);
            color: var(--leaf-green);
            padding: 8px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--forest-border);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.15);
        }

        h1 {
            font-size: 44px;
            font-weight: 700;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, #ffffff 0%, #6ee7b7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-dim);
            font-size: 16px;
            margin: 0;
        }

        .control-box {
            background: var(--forest-card);
            backdrop-filter: blur(15px);
            border: 1px solid var(--forest-border);
            padding: 18px 28px;
            border-radius: 24px;
            display: inline-flex;
            gap: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            margin-bottom: 45px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="text"] {
            background: rgba(6, 23, 15, 0.85);
            border: 1px solid rgba(52, 211, 153, 0.25);
            padding: 14px 20px 14px 45px;
            border-radius: 16px;
            color: white;
            font-size: 15px;
            font-family: inherit;
            width: 270px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--leaf-green);
            box-shadow: 0 0 0 4px var(--leaf-glow);
        }

        .input-icon {
            position: absolute;
            left: 16px;
            font-size: 18px;
            pointer-events: none;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 15px;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: none;
        }

        .btn-plant {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-plant:hover {
            background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);
        }

        .btn-water {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .btn-water:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
        }
        .btn-logout:hover {
            background: var(--danger-red);
            color: white;
        }

        #forest-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 30px;
        }

        /* 🌳 การ์ดต้นไม้พร้อมเอฟเฟกต์โยกเยก */
        .tree-card {
            background: var(--forest-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--forest-border);
            border-radius: 30px;
            padding: 30px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            transform-origin: bottom center;
            animation: breezeSway 6s ease-in-out infinite;
        }

        @keyframes breezeSway {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(0.8deg) translateY(-2px); }
        }

        .tree-card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, transparent, var(--leaf-green), transparent);
            opacity: 0.7;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .plot-number {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .delete-btn {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.25);
            color: var(--danger-red);
            width: 36px; height: 36px;
            border-radius: 12px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }

        .delete-btn:hover {
            background: var(--danger-red);
            color: white;
            box-shadow: 0 0 15px rgba(248, 113, 113, 0.5);
        }

        .nature-pod {
            background: rgba(6, 23, 15, 0.6);
            border: 1px solid rgba(52, 211, 153, 0.15);
            border-radius: 22px;
            padding: 25px;
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }

        .tree-avatar {
            font-size: 80px;
            margin-bottom: 12px;
            filter: drop-shadow(0 12px 18px rgba(0,0,0,0.35));
            animation: floatTree 3.5s ease-in-out infinite;
            display: inline-block;
            transform-origin: bottom center;
        }

        @keyframes floatTree {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(-2deg); }
        }

        .forest-tier-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .forest-weather {
            font-size: 13px;
            color: var(--leaf-green);
            background: rgba(52, 211, 153, 0.12);
            padding: 5px 14px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid rgba(52, 211, 153, 0.25);
        }

        .metrics-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: rgba(6, 23, 15, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 14px 16px;
            border-radius: 16px;
        }

        .metric-title {
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 5px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .metric-value.positive { color: var(--leaf-green); }
        .metric-value.negative { color: var(--danger-red); }

        .card-footer {
            font-size: 12px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 15px;
        }

        .empty-forest {
            grid-column: 1 / -1;
            background: var(--forest-card);
            border: 1px dashed var(--forest-border);
            padding: 60px;
            border-radius: 30px;
            text-align: center;
            color: var(--text-dim);
        }

        .empty-forest span {
            font-size: 55px;
            display: block;
            margin-bottom: 15px;
            animation: floatTree 3s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <!-- สายน้ำไหลเคลื่อนไหวที่ด้านล่างจอ -->
    <div class="river-container">
        <div class="river-wave-track" id="riverTrack"></div>
    </div>

    <!-- หน้าต่างลงทะเบียน / ล็อกอินอิสระ -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2>🌲 Living Forest Sanctuary</h2>
            <p id="auth-subtitle">สร้างบัญชีส่วนตัวหรือเข้าสู่ระบบเพื่อดูแลสวนป่าของคุณ</p>
            
            <div class="tab-switch">
                <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">เข้าสู่ระบบ</button>
                <button class="tab-btn" id="tab-register" onclick="switchTab('register')">สมัครสมาชิกใหม่</button>
            </div>

            <input type="text" id="usernameInput" class="auth-input" placeholder="ชื่อผู้ใช้ (Username)" autocomplete="off">
            <input type="password" id="passwordInput" class="auth-input" placeholder="รหัสผ่าน (Password)" onkeypress="checkAuthEnter(event)">
            
            <button class="btn btn-plant" id="authBtn" style="width: 100%; justify-content: center;" onclick="handleAuth()">เข้าสู่ระบบสวนป่า</button>
        </div>
    </div>

    <div class="container">
        <div class="user-bar">
            <div class="nature-badge">🌲 Living MT4 Forest Sanctuary</div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <span id="welcomeUser" style="color: var(--leaf-green); font-weight: 600;">ยินดีต้อนรับ</span>
                <button class="btn-logout" onclick="logoutUser()">ออกจากระบบ</button>
            </div>
        </div>

        <header>
            <h1>ป่าไม้แห่งการลงทุนส่วนตัว</h1>
            <p class="subtitle">จำลองสายลม สายน้ำ และสภาพอากาศเคลื่อนไหวเฉพาะพอร์ตในบัญชีของคุณ</p>
        </header>

        <div style="text-align: center;">
            <div class="control-box">
                <div class="input-wrapper">
                    <span class="input-icon">🌱</span>
                    <input type="text" id="loginId" placeholder="ระบุเลขพอร์ต MT4...">
                </div>
                <button class="btn btn-plant" onclick="addFarm()">
                    <span>🌲 ปลูกต้นไม้ใหม่</span>
                </button>
                <button class="btn btn-water" onclick="refreshAll()">
                    <span>💧 รดน้ำซิงค์ข้อมูล</span>
                </button>
            </div>
        </div>

        <div id="forest-grid"></div>
    </div>

    <script>
        // ลิงก์เชื่อมต่อ Google Apps Script ของคุณ
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzVJpGjKYIEUMvP4lrfeauE0ylJXtOaXndxxjXHfW3R0C6RYZ9mClszxEUA-3IRoHKApg/exec';
        
        let currentMode = 'login';
        let currentUser = sessionStorage.getItem('forest_current_user') || null;

        window.onload = () => {
            initRiver(); // เริ่มสายน้ำ
            startWindEffect(); // เริ่มสายลมและใบไม้
            if (currentUser) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('welcomeUser').innerText = `👤 ผู้ใช้งาน: ${currentUser}`;
                fetchUserFarmsFromCloud().then(() => {
                    renderForest();
                    refreshAll();
                });
            }
        };

        // ฟังก์ชันสร้างสายน้ำ
        function initRiver() {
            const track = document.getElementById('riverTrack');
            const content = '<div class="river-wave-item">🌊 💧 🌿 สายน้ำแห่งสภาพคล่องหล่อเลี้ยงผืนป่า 🌿 💧 🌊</div>';
            track.innerHTML = content.repeat(6);
        }

        // ฟังก์ชันสร้างลมพัดและใบไม้ปลิว
        function startWindEffect() {
            setInterval(() => {
                const leaf = document.createElement('div');
                leaf.className = 'falling-leaf';
                const icons = ['🍃', '🍂', '✨', '🌿'];
                leaf.innerText = icons[Math.floor(Math.random() * icons.length)];
                leaf.style.left = Math.random() * window.innerWidth + 'px';
                leaf.style.animationDuration = (Math.random() * 5 + 4) + 's';
                leaf.style.fontSize = (Math.random() * 10 + 14) + 'px';
                document.body.appendChild(leaf);
                
                setTimeout(() => {
                    leaf.remove();
                }, 9000);
            }, 1200);
        }

        function switchTab(mode) {
            currentMode = mode;
            const btnLogin = document.getElementById('tab-login');
            const btnReg = document.getElementById('tab-register');
            const subtitle = document.getElementById('auth-subtitle');
            const authBtn = document.getElementById('authBtn');

            if (mode === 'login') {
                btnLogin.classList.add('active');
                btnReg.classList.remove('active');
                subtitle.innerText = 'เข้าสู่ระบบเพื่อดูแลสวนป่าของคุณ';
                authBtn.innerText = 'เข้าสู่ระบบสวนป่า';
            } else {
                btnReg.classList.add('active');
                btnLogin.classList.remove('active');
                subtitle.innerText = 'ตั้งชื่อผู้ใช้และรหัสผ่านใหม่เพื่อสร้างสวนป่าของคุณเอง';
                authBtn.innerText = 'สร้างบัญชีสวนป่าใหม่';
            }
        }

        // ฟังก์ชันล็อกอินฉบับปรับปรุงใหม่ ป้องกันปุ่มค้างและมีแจ้งเตือน Error
        async function handleAuth() {
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            const btn = document.getElementById('authBtn');

            if (!user || !pass) {
                return alert('⚠️ กรุณากรอกชื่อผู้ใช้และรหัสผ่านให้ครบถ้วนครับ');
            }

            try {
                const originalText = btn.innerText;
                btn.innerText = 'กำลังเชื่อมต่อฐานข้อมูล...'; // แสดงข้อความโหลด
                
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: currentMode, user: user, pass: pass })
                });
                
                const textResult = await response.text(); 
                let data;
                
                try {
                    data = JSON.parse(textResult);
                } catch(e) {
                    // ดักจับ Error กรณีหลังบ้านสิทธิ์ยังไม่เป็น "ทุกคน"
                    console.error("Server Response:", textResult);
                    btn.innerText = originalText;
                    return alert('❌ ไม่สามารถเชื่อมต่อได้: โปรดตรวจสอบว่าสิทธิ์หลังบ้านตั้งเป็น "ทุกคน (Anyone)" แล้วครับ');
                }

                if (!data.success) {
                    btn.innerText = originalText;
                    return alert('❌ ' + (data.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'));
                }

                if (currentMode === 'register') {
                    alert('✅ สมัครสมาชิกสำเร็จ! ระบบกำลังพาเข้าสู่สวนป่าของคุณ...');
                }

                sessionStorage.setItem('forest_current_user', user);
                currentUser = user;

                if (data.farms) {
                    saveFarmsList(data.farms);
                }

                location.reload(); // โหลดหน้าใหม่เพื่อเข้าสวนป่า

            } catch (err) {
                btn.innerText = 'เข้าสู่ระบบสวนป่า';
                alert('❌ ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
            }
        }

        function checkAuthEnter(e) {
            if (e.key === 'Enter') handleAuth();
        }

        function logoutUser() {
            if (confirm('ต้องการออกจากระบบสวนป่าใช่หรือไม่?')) {
                sessionStorage.removeItem('forest_current_user');
                location.reload();
            }
        }

        function getUserFarmsKey() {
            return `mt4_forest_farms_${currentUser}`;
        }

        function getFarmsList() {
            return JSON.parse(localStorage.getItem(getUserFarmsKey()) || '[]');
        }

        function saveFarmsList(farms) {
            localStorage.setItem(getUserFarmsKey(), JSON.stringify(farms));
        }

        async function syncFarmsToCloud(farms) {
            if (!currentUser) return;
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'updateFarms', user: currentUser, farms: farms })
                });
            } catch (err) {
                console.error('Sync failed', err);
            }
        }

        async function fetchUserFarmsFromCloud() {
            if (!currentUser) return;
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getUserData&user=${currentUser}`);
                const data = await response.json();
                if (data.success && data.farms) {
                    saveFarmsList(data.farms);
                }
            } catch (err) {
                console.error('Fetch farms failed', err);
            }
        }

        function addFarm() {
            const loginInput = document.getElementById('loginId');
            const login = loginInput.value.trim();
            if (!login) { alert('กรุณากรอกเลขพอร์ต MT4 ครับ'); return; }
            
            let farms = getFarmsList();
            if (farms.includes(login)) { alert('พอร์ตนี้ถูกปลูกไว้ในป่าของคุณแล้วครับ'); return; }
            
            farms.push(login);
            saveFarmsList(farms);
            syncFarmsToCloud(farms);
            loginInput.value = '';
            renderForest();
            fetchNodeData(login);
        }

        window.removeFarm = function(login) {
            if(confirm(`ต้องการถอนต้นไม้พอร์ต ${login} ออกจากผืนป่าของคุณใช่หรือไม่?`)) {
                let farms = getFarmsList();
                farms = farms.filter(f => f !== login);
                saveFarmsList(farms);
                syncFarmsToCloud(farms);
                renderForest();
            }
        };

        function renderForest() {
            const grid = document.getElementById('forest-grid');
            grid.innerHTML = '';
            const farms = getFarmsList();

            if (farms.length === 0) {
                grid.innerHTML = `
                    <div class="empty-forest">
                        <span>🍃</span>
                        <h3 style="color:#fff; margin:0 0 5px 0; font-size: 20px;">ผืนป่ายังว่างเปล่า</h3>
                        <p style="margin:0;">พิมพ์เลขพอร์ต MT4 ด้านบน แล้วกด "ปลูกต้นไม้ใหม่" เพื่อเริ่มสร้างระบบนิเวศน์ส่วนตัวของคุณ</p>
                    </div>
                `;
                return;
            }

            farms.forEach(login => {
                const card = document.createElement('div');
                card.className = 'tree-card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="plot-number">🌲 #${login}</div>
                        <button class="delete-btn" onclick="window.removeFarm('${login}')" title="ถอนต้นไม้">✕</button>
                    </div>

                    <div class="nature-pod">
                        <div class="tree-avatar" id="avatar-${login}">🌱</div>
                        <div class="forest-tier-title" id="tier-${login}">กำลังหยั่งราก...</div>
                        <div class="forest-weather" id="weather-${login}">รอรับสภาพอากาศ</div>
                    </div>

                    <div class="metrics-container">
                        <div class="metric-card">
                            <div class="metric-title">Initial Balance</div>
                            <div class="metric-value" id="bal-${login}">$0.00</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-title">Current Equity</div>
                            <div class="metric-value" id="eq-${login}">$0.00</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-title">Floating P/L</div>
                            <div class="metric-value" id="pl-${login}">$0.00</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-title">Active Orders</div>
                            <div class="metric-value" id="ord-${login}">0 แปลง</div>
                        </div>
                    </div>

                    <div class="card-footer">
                        <span id="status-${login}" style="color: var(--leaf-green);">● กำลังเชื่อมต่อผืนป่า</span>
                        <span id="time-${login}">--:--:--</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function refreshAll() {
            await fetchUserFarmsFromCloud();
            renderForest();
            const farms = getFarmsList();
            farms.forEach(login => fetchNodeData(login));
        }

        async function fetchNodeData(login) {
            const avatarDiv = document.getElementById(`avatar-${login}`);
            const tierDiv = document.getElementById(`tier-${login}`);
            const weatherDiv = document.getElementById(`weather-${login}`);
            const statusDiv = document.getElementById(`status-${login}`);
            
            const balDiv = document.getElementById(`bal-${login}`);
            const eqDiv = document.getElementById(`eq-${login}`);
            const plDiv = document.getElementById(`pl-${login}`);
            const ordDiv = document.getElementById(`ord-${login}`);
            const timeDiv = document.getElementById(`time-${login}`);

            if(!avatarDiv) return;

            try {
                const response = await fetch(`${SCRIPT_URL}?login=${login}`);
                const data = await response.json();

                if (data.error || data.length === 0) {
                    statusDiv.innerHTML = '● ขาดการติดต่อ';
                    statusDiv.style.color = 'var(--danger-red)';
                    tierDiv.innerText = 'ต้นไม้แห้งเหี่ยว';
                    weatherDiv.innerText = '⚠️ ข้อมูลขาดหาย';
                    avatarDiv.innerText = '🍂';
                    return;
                }

                const latest = data[0];
                const balance = parseFloat(latest.balance);
                const equity = parseFloat(latest.equity);
                const profitLoss = parseFloat(latest.floating_pl);
                const diff = equity - balance;
                const percent = (balance > 0) ? (diff / balance) * 100 : 0;

                statusDiv.innerHTML = '● ป่าไม้อุดมสมบูรณ์';
                statusDiv.style.color = 'var(--leaf-green)';

                let treeEmoji = '🌱';
                let treeName = 'ต้นกล้าเงินออม (Seedling)';
                
                if (equity >= 20000) {
                    treeEmoji = '🍎';
                    treeName = 'ต้นแอปเปิลผลดกมั่งคั่ง (Golden Fruit Tree)';
                } else if (equity >= 10000) {
                    treeEmoji = '🌲';
                    treeName = 'มหาพฤกษาใหญ่ (Ancient Giant)';
                } else if (equity >= 5000) {
                    treeEmoji = '🌳';
                    treeName = 'ต้นไม้ร่มรื่น (Mature Tree)';
                } else if (equity >= 2000) {
                    treeEmoji = '🌿';
                    treeName = 'พุ่มไม้เขียวขจี (Growing Bush)';
                } else if (equity >= 1000) {
                    treeEmoji = '🪴';
                    treeName = 'ไม้ประดับในกระถาง (Pot Plant)';
                } else {
                    treeEmoji = '🌱';
                    treeName = 'ต้นกล้าเล็กๆ (Sprout)';
                }

                let weatherText = '🌤️ ท้องฟ้าแจ่มใส อากาศสบายๆ';
                if (percent >= 10) {
                    weatherText = '🌈 แดดออกสดใส พร้อมรุ้งงามทอประกาย';
                } else if (percent > 0) {
                    weatherText = '☀️ แดดออกอบอุ่น เหมาะแก่การเติบโต';
                } else if (percent === 0) {
                    weatherText = '⛅ ฟ้าครึ้ม เมฆบังอาทิตย์เล็กน้อย';
                } else if (percent <= -20) {
                    weatherText = '⛈️ พายุฝนฟ้าคะนองหนัก ลมแรงจัด!';
                } else {
                    weatherText = '🌧️ ฝนตกปรอยๆ ชุ่มฉ่ำทั่วผืนป่า';
                }

                avatarDiv.innerText = treeEmoji;
                tierDiv.innerText = treeName;
                weatherDiv.innerText = weatherText;

                balDiv.innerText = `$${balance.toFixed(2)}`;
                eqDiv.innerText = `$${equity.toFixed(2)}`;

                const plClass = profitLoss < 0 ? 'negative' : (profitLoss > 0 ? 'positive' : '');
                const plPrefix = profitLoss > 0 ? '+' : '';
                plDiv.className = `metric-value ${plClass}`;
                plDiv.innerText = `${plPrefix}$${profitLoss.toFixed(2)} (${plPrefix}${percent.toFixed(2)}%)`;

                ordDiv.innerText = `${latest.open_positions} แปลง`;
                timeDiv.innerText = new Date(latest.lastUpdated).toLocaleTimeString('th-TH');

            } catch (err) {
                statusDiv.innerHTML = '● ระบบขัดข้อง';
                statusDiv.style.color = 'var(--danger-red)';
                tierDiv.innerText = 'ดินแห้งแล้ง';
                weatherDiv.innerText = '⚠️ ภัยแล้งชั่วคราว';
                avatarDiv.innerText = '🥀';
            }
        }
    </script>
</body>
</html>
