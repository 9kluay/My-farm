<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K Sarakharm EA : Smart Agritech Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #040906;
            --surface-1: #0a140f;
            --surface-2: #101c15;
            --surface-3: #16261d;
            
            --border-dim: rgba(16, 185, 129, 0.15);
            --border-glow: rgba(16, 185, 129, 0.4);
            
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-mono: 'JetBrains Mono', monospace;
            
            --brand-green: #10b981;
            --brand-gold: #f59e0b;
            --brand-red: #ef4444;
            --brand-blue: #3b82f6;

            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.1) 0%, transparent 50%),
                linear-gradient(0deg, rgba(4,9,6,1) 0%, rgba(10,20,15,0.8) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px 20px 80px 20px;
        }

        /* --- Layout & Typography --- */
        .container { max-width: 1400px; margin: 0 auto; position: relative; z-index: 10; animation: fadeUp 0.6s ease-out; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .system-header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid var(--border-dim); padding-bottom: 15px; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .brand h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; background: linear-gradient(90deg, #fff, var(--brand-green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .brand p { font-size: 13px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 2px; }
        
        .sys-status { display: flex; gap: 10px; align-items: center; }
        .status-pill { background: rgba(16, 185, 129, 0.05); border: 1px solid var(--border-dim); padding: 6px 12px; border-radius: 20px; font-size: 11px; color: var(--brand-green); display: flex; align-items: center; gap: 6px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
        .dot { width: 6px; height: 6px; background: var(--brand-green); border-radius: 50%; box-shadow: 0 0 8px var(--brand-green); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* --- Global Stats Dashboard --- */
        .master-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--surface-1); border: 1px solid var(--border-dim); border-radius: var(--radius-lg); padding: 20px; position: relative; overflow: hidden; }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--brand-green); opacity: 0.5; }
        .stat-card:nth-child(2)::before { background: var(--brand-gold); }
        .stat-card:nth-child(3)::before { background: var(--brand-blue); }
        .stat-card h3 { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 500; }
        .stat-card .value { font-size: 26px; font-family: var(--text-mono); font-weight: 700; color: #fff; }
        .stat-card .sub-value { font-size: 12px; margin-top: 5px; color: var(--text-secondary); }

        /* --- Controls --- */
        .controls-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--surface-1); padding: 12px 20px; border-radius: var(--radius-md); border: 1px solid var(--border-dim); flex-wrap: wrap; gap: 15px; }
        .search-group { display: flex; gap: 10px; align-items: center; }
        .input-pro { background: var(--surface-2); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 8px 15px; border-radius: 8px; font-family: inherit; font-size: 13px; outline: none; transition: 0.3s; }
        .input-pro:focus { border-color: var(--brand-green); box-shadow: 0 0 10px rgba(16,185,129,0.1); }
        
        .btn-pro { background: rgba(16, 185, 129, 0.1); border: 1px solid var(--brand-green); color: var(--brand-green); padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 6px; }
        .btn-pro:hover { background: var(--brand-green); color: #000; box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }

        /* --- Farm Grid & Pro Cards --- */
        .grid-system { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; }
        
        .farm-node { background: var(--surface-1); border: 1px solid var(--border-dim); border-radius: var(--radius-lg); overflow: hidden; transition: 0.3s ease; position: relative; display: flex; flex-direction: column; }
        .farm-node:hover { transform: translateY(-3px); border-color: var(--border-glow); box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px rgba(16,185,129,0.05); }

        .node-header { padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.03); display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.01); }
        .node-id { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .node-id span { font-family: var(--text-mono); color: var(--brand-green); }
        .node-status { font-size: 10px; background: rgba(16,185,129,0.1); padding: 3px 8px; border-radius: 4px; color: var(--brand-green); }

        .node-body { padding: 20px; display: grid; grid-template-columns: 100px 1fr; gap: 20px; align-items: center; }
        
        /* Ecosystem Monitor (The Visual Part) */
        .eco-monitor { width: 100px; height: 100px; border-radius: 50%; border: 2px dashed rgba(255,255,255,0.1); display: flex; justify-content: center; align-items: center; position: relative; background: var(--surface-2); }
        .eco-monitor::after { content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); pointer-events: none; }
        .eco-visual { font-size: 42px; position: relative; z-index: 5; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); transition: 0.3s; }
        .camp-fire { position: absolute; right: -10px; bottom: 0; font-size: 24px; animation: flicker 1.5s infinite alternate; z-index: 10; }
        @keyframes flicker { 0% { transform: scale(1); filter: drop-shadow(0 0 5px #f97316); } 100% { transform: scale(1.1); filter: drop-shadow(0 0 15px #f97316); } }
        
        /* Data Layout */
        .fin-data { display: flex; flex-direction: column; gap: 12px; }
        .data-row { display: flex; justify-content: space-between; align-items: center; }
        .d-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; }
        .d-val { font-family: var(--text-mono); font-size: 14px; font-weight: 600; }
        .d-val.lg { font-size: 18px; }
        .text-green { color: var(--brand-green); } .text-red { color: var(--brand-red); } .text-gold { color: var(--brand-gold); }

        .node-footer { padding: 12px 20px; background: var(--surface-2); border-top: 1px solid rgba(255,255,255,0.02); display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
        .f-box h4 { font-size: 9px; color: var(--text-secondary); margin-bottom: 3px; font-weight: 400; }
        .f-box p { font-family: var(--text-mono); font-size: 11px; font-weight: 600; }
        .f-box:not(:last-child) { border-right: 1px solid rgba(255,255,255,0.05); }

        .sync-hud { position: fixed; bottom: 20px; right: 20px; background: var(--surface-1); border: 1px solid var(--border-dim); padding: 8px 15px; border-radius: 8px; font-size: 11px; font-family: var(--text-mono); color: var(--brand-green); display: flex; align-items: center; gap: 8px; z-index: 100; box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: 0.3s; opacity: 0; transform: translateY(10px); }
        .sync-hud.active { opacity: 1; transform: translateY(0); }
        .spinner { width: 12px; height: 12px; border: 2px solid rgba(16,185,129,0.3); border-top-color: var(--brand-green); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-dim); }

    </style>
</head>
<body>

    <div class="sync-hud" id="sync-hud">
        <div class="spinner"></div> <span>SYNCING DATA...</span>
    </div>

    <div class="container">
        <!-- Header -->
        <header class="system-header">
            <div class="brand">
                <h1>K SARAKHARM EA</h1>
                <p>Agritech Ecosystem Dashboard v2.0</p>
            </div>
            <div class="sys-status">
                <div class="status-pill" id="weather-sys">📡 WEATHER: CALM</div>
                <div class="status-pill"><div class="dot"></div> NETWORK ACTIVE</div>
            </div>
        </header>

        <!-- Global Master Stats -->
        <section class="master-stats">
            <div class="stat-card">
                <h3>Total Balance</h3>
                <div class="value" id="sys-bal">$0.00</div>
                <div class="sub-value">Capital Allocated</div>
            </div>
            <div class="stat-card">
                <h3>Total Equity</h3>
                <div class="value" id="sys-eq">$0.00</div>
                <div class="sub-value">Current Value</div>
            </div>
            <div class="stat-card">
                <h3>Floating P/L</h3>
                <div class="value text-green" id="sys-pl">$0.00</div>
                <div class="sub-value" id="sys-pct">0.00% Net Yield</div>
            </div>
            <div class="stat-card">
                <h3>Active Sectors</h3>
                <div class="value text-gold"><span id="sys-farms">0</span> / <span id="sys-trees">0</span></div>
                <div class="sub-value">Plots / Operational Nodes</div>
            </div>
        </section>

        <!-- Controls -->
        <div class="controls-bar">
            <div class="search-group">
                <input type="text" id="searchInput" class="input-pro" placeholder="Search Plot ID..." oninput="renderGrid()">
                <select id="sortInput" class="input-pro" onchange="renderGrid()">
                    <option value="bal">Sort: Balance (High-Low)</option>
                    <option value="pl">Sort: Profit (High-Low)</option>
                    <option value="id">Sort: Plot ID</option>
                </select>
            </div>
            <div class="search-group">
                <button class="btn-pro" onclick="forceSync()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-10.31l5.63 2.74"/></svg>
                    FORCE SYNC
                </button>
            </div>
        </div>

        <!-- Grid -->
        <div class="grid-system" id="farm-grid">
            <!-- Cards injected via JS -->
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbytS0pOy1Vhaf7ZKAooZvDVkoJTVcFK4W4nsImNhqlODyKSQbLAu4ej9Ninr9WPs2JO/exec';
        let db = {}; 

        // Utility Formatter
        const fmtMoney = (v) => {
            const val = parseFloat(v) || 0;
            const abs = Math.abs(val).toFixed(2);
            return val > 0 ? `+$${abs}` : (val < 0 ? `-$${abs}` : `$0.00`);
        };
        const fmtPct = (v) => {
            const val = parseFloat(v) || 0;
            return val > 0 ? `+${val.toFixed(2)}%` : `${val.toFixed(2)}%`;
        };
        const colorClass = (v) => v > 0 ? 'text-green' : (v < 0 ? 'text-red' : 'text-secondary');

        // Initializer
        window.onload = async () => {
            await syncData();
            setInterval(syncData, 60000); // 60s Auto Sync
        };

        async function forceSync() {
            document.getElementById('sync-hud').classList.add('active');
            await syncData();
            setTimeout(() => document.getElementById('sync-hud').classList.remove('active'), 800);
        }

        async function syncData() {
            try {
                // Fetch list
                const resList = await fetch(`${SCRIPT_URL}?action=getAllFarms`);
                const cloudList = await resList.json();
                
                if(Array.isArray(cloudList)) {
                    let localList = JSON.parse(localStorage.getItem('sf_farms') || '[]');
                    let merged = [...new Set([...localList, ...cloudList])];
                    localStorage.setItem('sf_farms', JSON.stringify(merged));
                    
                    // Fetch details
                    await Promise.all(merged.map(id => fetchNodeInfo(id)));
                    updateGlobalHUD();
                    renderGrid();
                }
            } catch(e) { console.error("Sync Error", e); }
        }

        async function fetchNodeInfo(id) {
            try {
                const res = await fetch(`${SCRIPT_URL}?login=${id}`);
                const data = await res.json();
                if(!data.error && data.length > 0) {
                    const latest = data[data.length - 1];
                    const bal = parseFloat(latest.balance);
                    const pl = parseFloat(latest.floating_pl);
                    db[id] = {
                        bal: bal, eq: parseFloat(latest.equity), pl: pl,
                        pct: bal > 0 ? (pl/bal)*100 : 0,
                        orders: parseInt(latest.open_positions||0),
                        win: parseInt(latest.profit_orders||0),
                        loss: parseInt(latest.loss_orders||0),
                        tdy: parseFloat(latest.profit_today||0),
                        wk: parseFloat(latest.profit_week||0),
                        mo: parseFloat(latest.profit_month||0),
                        last: latest.lastUpdated, err: false
                    };
                } else { db[id] = {err: true}; }
            } catch(e) { db[id] = {err: true}; }
        }

        function getSortedFarms() {
            let farms = JSON.parse(localStorage.getItem('sf_farms') || '[]');
            const query = document.getElementById('searchInput').value.toLowerCase();
            const sortMethod = document.getElementById('sortInput').value;

            farms = farms.filter(f => f.toLowerCase().includes(query));

            return farms.sort((a, b) => {
                const dA = db[a] || {}; const dB = db[b] || {};
                const bA = dA.bal || 0; const bB = dB.bal || 0;
                
                if (bA === 0 && bB !== 0) return 1;
                if (bB === 0 && bA !== 0) return -1;

                if(sortMethod === 'pl') return (dB.pl||0) - (dA.pl||0);
                if(sortMethod === 'id') return parseInt(a) - parseInt(b);
                return bB - bA; // default bal
            });
        }

        function updateGlobalHUD() {
            let tBal = 0, tEq = 0, tPl = 0, tOrders = 0;
            let activeNodes = 0;
            
            Object.values(db).forEach(d => {
                if(!d.err && d.bal > 0) {
                    tBal += d.bal; tEq += d.eq; tPl += d.pl; tOrders += d.orders; activeNodes++;
                }
            });

            document.getElementById('sys-bal').innerText = `$${tBal.toFixed(2)}`;
            document.getElementById('sys-eq').innerText = `$${tEq.toFixed(2)}`;
            
            const plEl = document.getElementById('sys-pl');
            plEl.innerText = fmtMoney(tPl);
            plEl.className = `value ${colorClass(tPl)}`;
            
            const pct = tBal > 0 ? (tPl/tBal)*100 : 0;
            document.getElementById('sys-pct').innerText = `${fmtPct(pct)} Net Yield`;
            
            document.getElementById('sys-farms').innerText = activeNodes;
            document.getElementById('sys-trees').innerText = tOrders;

            // Simple Weather logic
            const wSys = document.getElementById('weather-sys');
            if (pct >= 5) { wSys.innerText = '📡 WEATHER: EXCELLENT'; wSys.style.color = 'var(--brand-green)'; }
            else if (pct < -5) { wSys.innerText = '📡 WEATHER: STORM WARNING'; wSys.style.color = 'var(--brand-red)'; }
            else { wSys.innerText = '📡 WEATHER: CALM'; wSys.style.color = 'var(--text-secondary)'; }
        }

        function renderGrid() {
            const grid = document.getElementById('farm-grid');
            grid.innerHTML = '';
            const farms = getSortedFarms();

            if(farms.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 50px; color: var(--text-secondary);">NO DATA FOUND OR NO NODES CONNECTED.</div>`;
                return;
            }

            // Find Max Bal for Level Calculation
            let maxB = 1;
            farms.forEach(f => { if(db[f] && db[f].bal > maxB) maxB = db[f].bal; });

            farms.forEach(id => {
                const d = db[id] || { bal:0, eq:0, pl:0, pct:0, orders:0, tdy:0, wk:0, mo:0, err:true };
                
                // Logic for Visual Monitor
                let visualHtml = '';
                let statusText = 'OFFLINE';
                let statusClass = 'text-secondary';
                let borderColor = 'transparent';

                if (d.err) {
                    visualHtml = `<div class="eco-visual" style="filter:grayscale(1); opacity:0.3;">🪨</div>`;
                } else if (d.bal <= 0) {
                    statusText = 'EMPTY PLOT';
                    visualHtml = `<div class="eco-visual" style="filter:grayscale(1); opacity:0.5;">🪨</div>`;
                } else if (d.orders === 0) {
                    statusText = 'STANDBY (CAMP)';
                    statusClass = 'text-gold';
                    borderColor = 'var(--brand-gold)';
                    visualHtml = `
                        <div class="eco-visual" style="font-size: 48px;">🏕️</div>
                        <div class="camp-fire">🔥</div>
                    `;
                } else {
                    statusText = 'ACTIVE YIELD';
                    statusClass = 'text-green';
                    borderColor = d.pl > 0 ? 'var(--brand-green)' : (d.pl < 0 ? 'var(--brand-red)' : 'var(--border-dim)');
                    
                    let lvl = Math.ceil(d.bal / (maxB / 6)); lvl = Math.max(1, Math.min(6, lvl));
                    const trees = ['🌱', '🌿', '☘️', '🌴', '🌲', '🌳'];
                    
                    visualHtml = `<div class="eco-visual" style="font-size: 54px; ${d.pl > 0 ? 'filter: drop-shadow(0 0 10px rgba(16,185,129,0.8));' : ''}">${trees[lvl-1]}</div>`;
                }

                // Card HTML Construction
                const card = document.createElement('div');
                card.className = 'farm-node';
                card.innerHTML = `
                    <div class="node-header">
                        <div class="node-id">PLOT <span>#${id}</span></div>
                        <div class="node-status" style="color: ${statusClass}; border: 1px solid ${statusClass}; background: transparent;">${statusText}</div>
                    </div>
                    
                    <div class="node-body">
                        <div class="eco-monitor" style="border-color: ${borderColor}">
                            ${visualHtml}
                        </div>
                        
                        <div class="fin-data">
                            <div class="data-row">
                                <span class="d-label">Balance</span>
                                <span class="d-val">$${d.bal.toFixed(2)}</span>
                            </div>
                            <div class="data-row">
                                <span class="d-label">Equity</span>
                                <span class="d-val">$${d.eq.toFixed(2)}</span>
                            </div>
                            <div class="data-row" style="margin-top: 5px; padding-top: 5px; border-top: 1px dashed rgba(255,255,255,0.05);">
                                <span class="d-label">Floating</span>
                                <span class="d-val lg ${colorClass(d.pl)}">${fmtMoney(d.pl)} <span style="font-size:10px;">(${fmtPct(d.pct)})</span></span>
                            </div>
                        </div>
                    </div>

                    <div class="node-footer">
                        <div class="f-box">
                            <h4>TODAY</h4>
                            <p class="${colorClass(d.tdy)}">${fmtMoney(d.tdy)}</p>
                        </div>
                        <div class="f-box">
                            <h4>THIS WEEK</h4>
                            <p class="${colorClass(d.wk)}">${fmtMoney(d.wk)}</p>
                        </div>
                        <div class="f-box">
                            <h4>THIS MONTH</h4>
                            <p class="${colorClass(d.mo)}">${fmtMoney(d.mo)}</p>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
