<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ป่าไม้แห่งการลงทุน - Living Forest</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --forest-dark: #071911;
            --forest-card: rgba(14, 38, 26, 0.85);
            --forest-border: rgba(52, 211, 153, 0.25);
            --leaf-green: #34d399;
            --text-light: #ecfdf5;
            --text-dim: #9ca3af;
            --danger-red: #f87171;
            --sun-gold: #fbbf24;
            --card-hover: rgba(20, 48, 35, 0.95);
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--forest-dark);
            background-image: 
                radial-gradient(circle at 20% 10%, rgba(16, 185, 129, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 80% 90%, rgba(5, 150, 105, 0.12) 0%, transparent 40%);
            color: var(--text-light);
            margin: 0; padding: 40px 20px 100px 20px;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 🌊 สายน้ำไหล */
        .river-container {
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 50px;
            background: linear-gradient(180deg, rgba(4, 47, 46, 0.4) 0%, rgba(2, 44, 34, 0.95) 100%);
            border-top: 2px solid rgba(52, 211, 153, 0.3);
            z-index: 999;
            box-shadow: 0 -10px 30px rgba(52, 211, 153, 0.25);
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .river-wave-track {
            display: flex;
            white-space: nowrap;
            animation: flowRiver 15s linear infinite;
        }

        .river-wave-item {
            font-size: 16px;
            font-weight: 500;
            color: #6ee7b7;
            padding-right: 40px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.6);
        }

        @keyframes flowRiver {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* 🍃 ใบไม้ปลิว */
        .falling-leaf {
            position: fixed;
            top: -50px;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: fallLeaf linear infinite;
        }
        @keyframes fallLeaf {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.9; }
            100% { transform: translateY(105vh) translateX(120px) rotate(360deg); opacity: 0; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--forest-card);
            border: 1px solid var(--forest-border);
            padding: 12px 25px;
            border-radius: 30px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        .nature-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(52, 211, 153, 0.12);
            color: var(--leaf-green);
            padding: 8px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--forest-border);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.15);
        }

        h1 {
            font-size: 40px;
            font-weight: 700;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #ffffff 0%, #6ee7b7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-dim);
            font-size: 15px;
            margin: 0;
        }

        /* 📊 แถบรวมยอดพอร์ตทั้งหมด */
        .summary-dashboard {
            background: rgba(14, 38, 26, 0.6);
            border: 1px solid var(--forest-border);
            border-radius: 28px;
            padding: 22px 25px;
            margin-bottom: 35px;
            backdrop-filter: blur(20px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
        }

        @media (max-width: 1100px) { .summary-dashboard { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 600px) { .summary-dashboard { grid-template-columns: repeat(2, 1fr); } }

        .summary-item {
            background: rgba(6, 23, 15, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px 10px;
            border-radius: 18px;
            text-align: center;
            box-shadow: inset 0 2px 10px rgba(255,255,255,0.02);
        }

        .summary-item:hover {
            transform: translateY(-3px);
            border-color: rgba(52, 211, 153, 0.3);
            background: rgba(6, 23, 15, 0.95);
        }

        .summary-label {
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .summary-val {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .summary-val.positive { color: var(--leaf-green); }
        .summary-val.negative { color: var(--danger-red); }

        .control-box {
            background: transparent;
            margin-bottom: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .btn-water {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: #fff;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
            padding: 16px 45px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 18px;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-water:hover {
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 30px rgba(59, 130, 246, 0.5);
        }

        /* 🌳 ลานป่า */
        #forest-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 30px;
            position: relative;
        }

        .tree-card {
            background: var(--forest-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--forest-border);
            border-radius: 30px;
            padding: 25px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            order: 999;
        }
        
        .tree-card:hover {
            background: var(--card-hover);
            border-color: rgba(52, 211, 153, 0.5);
            box-shadow: 0 20px 45px rgba(16, 185, 129, 0.2);
            transform: translateY(-5px);
            z-index: 2;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .plot-number {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.3);
            padding: 6px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .delete-btn {
            background: rgba(248, 113, 113, 0.05);
            border: 1px solid rgba(248, 113, 113, 0.2);
            color: var(--danger-red);
            width: 32px; height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
        }
        .delete-btn:hover {
            background: var(--danger-red);
            color: white;
            transform: rotate(90deg);
        }

        .nature-pod {
            background: radial-gradient(circle at center, rgba(16, 185, 129, 0.05) 0%, transparent 70%);
            padding: 20px 10px 15px;
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
            min-height: 100px;
            width: 100%;
        }

        .forest-cluster {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100px;
            width: 100%;
        }
        
        .tree-base {
            font-size: 85px;
            position: relative;
            z-index: 5;
            animation: floatTree 4s ease-in-out infinite;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));
            line-height: 1;
        }

        .tree-extra {
            position: absolute;
            bottom: -5px;
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.5)) brightness(0.85);
            line-height: 1;
        }
        
        .tree-extra.withered {
            filter: grayscale(0.8) brightness(0.6) drop-shadow(0 5px 5px rgba(0,0,0,0.6));
        }

        .extra-1 { right: 50%; margin-right: 25px; font-size: 65px; z-index: 4; animation: floatTree 4.5s ease-in-out infinite 0.5s; }
        .extra-2 { left: 50%; margin-left: 25px; font-size: 60px; z-index: 3; animation: floatTree 5s ease-in-out infinite 1s; }
        .extra-3 { right: 50%; margin-right: 55px; font-size: 50px; z-index: 2; animation: floatTree 5.5s ease-in-out infinite 1.5s; }
        .extra-4 { left: 50%; margin-left: 55px; font-size: 45px; z-index: 1; animation: floatTree 6s ease-in-out infinite 2s; }
        .extra-5 { right: 50%; margin-right: 75px; font-size: 40px; z-index: 0; animation: floatTree 6.5s ease-in-out infinite 2.5s; }

        @keyframes floatTree {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            50% { transform: translateY(-5px) rotate(-2deg) scale(1.02); }
        }

        .sparkle {
            position: absolute;
            font-size: 24px;
            color: #fbbf24;
            animation: blinkStar 1.5s ease-in-out infinite alternate;
            z-index: 10;
            pointer-events: none;
            filter: drop-shadow(0 0 8px rgba(251,191,36,0.6));
        }
        .sparkle-1 { top: -10px; right: 20%; animation-delay: 0s; }
        .sparkle-2 { top: 35px; left: 15%; animation-delay: 0.5s; font-size: 18px; }
        .sparkle-3 { bottom: 15px; right: 10%; animation-delay: 1s; font-size: 20px; }

        @keyframes blinkStar {
            0% { opacity: 0; transform: scale(0.5) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.2) rotate(15deg); }
            100% { opacity: 0; transform: scale(0.5) rotate(30deg); }
        }

        .weather-badge {
            position: absolute;
            bottom: -5px;
            right: 0;
            font-size: 12px;
            color: var(--leaf-green);
            background: rgba(6, 43, 31, 0.95);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(52, 211, 153, 0.5);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            z-index: 15;
            backdrop-filter: blur(5px);
            transform: translateX(20%);
        }

        .forest-tier-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin: 0;
            padding: 8px 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .metrics-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .metric-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 12px 15px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .metric-title {
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 4px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }
        .metric-value.positive { color: var(--leaf-green); }
        .metric-value.negative { color: var(--danger-red); }
        
        .history-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            padding: 10px;
            margin-bottom: 20px;
            gap: 5px;
        }
        .history-item {
            text-align: center;
            border-right: 1px solid rgba(255,255,255,0.05);
        }
        .history-item:last-child { border-right: none; }
        .history-label {
            font-size: 10px;
            color: var(--text-dim);
            margin-bottom: 3px;
        }
        .history-val {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
        }
        .history-val.positive { color: var(--leaf-green); }
        .history-val.negative { color: var(--danger-red); }

        .card-footer {
            font-size: 12px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
            padding-top: 15px;
            margin-top: auto;
        }
        
        .status-dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            margin-right: 5px;
            background-color: currentColor;
            box-shadow: 0 0 8px currentColor;
        }

        .empty-forest {
            grid-column: 1 / -1;
            background: rgba(14, 38, 26, 0.5);
            border: 2px dashed rgba(52, 211, 153, 0.2);
            padding: 80px 20px;
            border-radius: 40px;
            text-align: center;
            color: var(--text-dim);
            backdrop-filter: blur(10px);
        }
        
        #syncing-overlay {
            position: fixed; top: 20px; right: 20px;
            background: rgba(16, 185, 129, 0.15); border: 1px solid var(--leaf-green);
            color: var(--leaf-green); padding: 10px 20px; border-radius: 30px;
            font-size: 14px; z-index: 1000; font-weight: 600; backdrop-filter: blur(15px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: none; transition: 0.3s;
        }
    </style>
</head>
<body>

    <div id="syncing-overlay">☁️ กำลังซิงค์ผืนป่าจากคลาวด์...</div>
    <div class="river-container"><div class="river-wave-track" id="riverTrack"></div></div>

    <div class="container">
        <div class="user-bar">
            <div class="nature-badge">🌲 Living MT4 Forest Sanctuary</div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <span style="color: var(--leaf-green); font-weight: 600;">🌿 สวนป่าส่วนตัวของคุณ</span>
            </div>
        </div>

        <header>
            <h1>ป่าไม้แห่งการลงทุน</h1>
            <p class="subtitle">ระบบจัดอันดับอัตโนมัติ และแสดงสถานะป่าตาม % กำไร 🌟</p>
        </header>

        <div class="summary-dashboard">
            <div class="summary-item">
                <div class="summary-label">💰 Total Balance</div>
                <div class="summary-val" id="sum-balance">$0.00</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">💎 Total Equity</div>
                <div class="summary-val" id="sum-equity">$0.00</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">📈 Floating P/L</div>
                <div class="summary-val" id="sum-pl">$0.00</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">📊 Profit %</div>
                <div class="summary-val" id="sum-percent">0.00%</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">🌲 รวมแปลงทั้งหมด</div>
                <div class="summary-val" id="sum-farms" style="color: var(--leaf-green);">0 แปลง</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">🌱 รวมจำนวนต้น</div>
                <div class="summary-val" id="sum-trees" style="color: var(--sun-gold);">0 ต้น</div>
            </div>
        </div>

        <div style="text-align: center;">
            <div class="control-box">
                <button class="btn btn-water" onclick="syncAndRefreshAll()">
                    <span>💧 ซิงค์และโหลดข้อมูลฟาร์มทั้งหมด (Auto Sync)</span>
                </button>
            </div>
        </div>

        <div id="forest-grid"></div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbytS0pOy1Vhaf7ZKAooZvDVkoJTVcFK4W4nsImNhqlODyKSQbLAu4ej9Ninr9WPs2JO/exec';
        
        let globalPortfolioData = {};
        
        window.onload = async () => {
            initRiver();
            startWindEffect();
            renderForest(); 
            await syncAndRefreshAll(); 
        };

        async function syncAndRefreshAll() {
            await syncFarmsFromCloud();
            const farms = getFarmsList();
            if(farms.length > 0) {
                farms.forEach(login => fetchNodeData(login));
            }
        }

        async function syncFarmsFromCloud() {
            const overlay = document.getElementById('syncing-overlay');
            overlay.style.display = 'block';
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getAllFarms`);
                const cloudFarms = await response.json();
                if(Array.isArray(cloudFarms)) {
                    let localFarms = getFarmsList();
                    let mergedFarms = [...new Set([...localFarms, ...cloudFarms])];
                    saveFarmsList(mergedFarms);
                    renderForest();
                }
            } catch(e) {
                console.error("Cloud Sync Failed", e);
            }
            overlay.style.display = 'none';
        }

        function initRiver() {
            const track = document.getElementById('riverTrack');
            const content = '<div class="river-wave-item">🌊 💧 🌿 สายน้ำแห่งสภาพคล่องหล่อเลี้ยงผืนป่า 🌿 💧 🌊</div>';
            track.innerHTML = content.repeat(6);
        }

        function startWindEffect() {
            setInterval(() => {
                const leaf = document.createElement('div');
                leaf.className = 'falling-leaf';
                const icons = ['🍃', '🍂', '✨', '🌿'];
                leaf.innerText = icons[Math.floor(Math.random() * icons.length)];
                leaf.style.left = Math.random() * window.innerWidth + 'px';
                leaf.style.animationDuration = (Math.random() * 5 + 4) + 's';
                leaf.style.fontSize = (Math.random() * 10 + 14) + 'px';
                document.body.appendChild(leaf);
                setTimeout(() => leaf.remove(), 9000);
            }, 1200);
        }

        function getFarmsList() { return JSON.parse(localStorage.getItem('my_forest_farms') || '[]'); }
        function saveFarmsList(farms) { localStorage.setItem('my_forest_farms', JSON.stringify(farms)); }

        window.removeFarm = async function(login) {
            if(confirm(`ต้องการถอนพอร์ต ${login} ออกถาวรใช่หรือไม่?`)) {
                const overlay = document.getElementById('syncing-overlay');
                overlay.innerText = `🔥 กำลังเผาถอนรากพอร์ต ${login} ออกจากคลาวด์...`;
                overlay.style.backgroundColor = 'rgba(248, 113, 113, 0.2)';
                overlay.style.borderColor = 'var(--danger-red)';
                overlay.style.color = 'var(--danger-red)';
                overlay.style.display = 'block';
                try {
                    await fetch(`${SCRIPT_URL}?action=deleteFarm&login=${login}`);
                    let farms = getFarmsList();
                    farms = farms.filter(f => f !== login);
                    saveFarmsList(farms);
                    delete globalPortfolioData[login];
                    updatePortfolioSummary();
                    renderForest(); 
                } catch(e) {
                    alert('เกิดข้อผิดพลาดในการเชื่อมต่อเพื่อลบข้อมูล กรุณาลองใหม่');
                }
                overlay.innerText = '☁️ กำลังซิงค์ผืนป่าจากคลาวด์...';
                overlay.style.backgroundColor = 'rgba(16, 185, 129, 0.15)';
                overlay.style.borderColor = 'var(--leaf-green)';
                overlay.style.color = 'var(--leaf-green)';
                overlay.style.display = 'none';
            }
        };

        function renderForest() {
            const grid = document.getElementById('forest-grid');
            grid.innerHTML = '';
            const farms = getFarmsList();

            if (farms.length === 0) {
                grid.innerHTML = `
                    <div class="empty-forest">
                        <span style="font-size: 60px; display: block; margin-bottom: 20px;">🍃</span>
                        <h3 style="color:#fff; margin:0 0 10px 0; font-size: 24px;">ผืนป่ายังว่างเปล่า</h3>
                        <p style="margin:0; line-height: 1.6;">ระบบจะดึงพอร์ตมาสร้างอัตโนมัติเมื่อ EA ของคุณส่งข้อมูลเข้า Sheet</p>
                    </div>
                `;
                updatePortfolioSummary();
                return;
            }

            farms.forEach(login => {
                const card = document.createElement('div');
                card.className = 'tree-card';
                card.setAttribute('data-login', login);
                card.innerHTML = `
                    <div class="card-header">
                        <div class="plot-number">
                            🌲 #${login}
                            <span id="stars-${login}" style="font-size: 14px; margin-left: 10px; color: #fbbf24; text-shadow: 0 2px 4px rgba(251,191,36,0.3); letter-spacing: 2px;"></span>
                        </div>
                        <button class="delete-btn" onclick="window.removeFarm('${login}')" title="ลบถาวร">✕</button>
                    </div>

                    <div class="nature-pod">
                        <div class="avatar-container" id="avatar-container-${login}">
                            <div class="tree-avatar">🌱</div>
                            <div class="weather-badge" id="weather-badge-${login}"><span>⏳</span> รอรับข้อมูล</div>
                        </div>
                        <div class="forest-tier-title" id="tier-${login}">กำลังหยั่งราก...</div>
                    </div>

                    <div class="metrics-container">
                        <div class="metric-card">
                            <div class="metric-title">Initial Balance</div>
                            <div class="metric-value" id="bal-${login}">$0.00</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-title">Current Equity</div>
                            <div class="metric-value" id="eq-${login}">$0.00</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-title">Floating P/L</div>
                            <div class="metric-value" id="pl-${login}">$0.00</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-title">Orders (แยกไม้)</div>
                            <div class="metric-value" id="ord-${login}">0 ไม้</div>
                        </div>
                    </div>

                    <div class="history-bar">
                        <div class="history-item">
                            <div class="history-label">วันนี้</div>
                            <div class="history-val" id="today-${login}">$0.00</div>
                        </div>
                        <div class="history-item">
                            <div class="history-label">สัปดาห์นี้</div>
                            <div class="history-val" id="week-${login}">$0.00</div>
                        </div>
                        <div class="history-item">
                            <div class="history-label">เดือนนี้</div>
                            <div class="history-val" id="month-${login}">$0.00</div>
                        </div>
                    </div>

                    <div class="card-footer">
                        <span id="status-${login}" style="color: var(--leaf-green); display: flex; align-items: center;">
                            <span class="status-dot"></span> กำลังเชื่อมต่อผืนป่า
                        </span>
                        <span id="time-${login}">--:--:--</span>
                    </div>
                `;
                grid.appendChild(card);
            });

            farms.forEach(login => {
                if (globalPortfolioData[login]) updateUICard(login);
            });
            updateTreeRanks();
        }

        async function fetchNodeData(login) {
            try {
                const response = await fetch(`${SCRIPT_URL}?login=${login}`);
                const data = await response.json();

                if (data.error || data.length === 0) {
                    globalPortfolioData[login] = { balance: 0, equity: 0, profit: 0, initial: 0, percent: 0, open_positions: 0, profit_orders: 0, loss_orders: 0, profit_today: 0, profit_week: 0, profit_month: 0, error: true };
                } else {
                    const latest = data.at(-1); 
                    const balance = parseFloat(latest.balance);
                    const equity = parseFloat(latest.equity);
                    const profitLoss = parseFloat(latest.floating_pl);
                    const openPositions = parseInt(latest.open_positions || 0);
                    
                    let initialDeposit = parseFloat(latest.initial_deposit);
                    if (!initialDeposit || initialDeposit <= 0) {
                        initialDeposit = balance;
                    }
                    
                    // 📐 คำนวณ % จากทุน/มูลค่าปัจจุบัน (Current Equity)
                    const percent = (equity > 0) ? (profitLoss / equity) * 100 : 0;
                    
                    const pOrders = parseInt(latest.profit_orders || 0);
                    const lOrders = parseInt(latest.loss_orders || 0);
                    const pToday = parseFloat(latest.profit_today || 0);
                    const pWeek = parseFloat(latest.profit_week || 0);
                    const pMonth = parseFloat(latest.profit_month || 0);
                    
                    globalPortfolioData[login] = { 
                        balance: balance, equity: equity, profit: profitLoss, initial: initialDeposit,
                        percent: percent, open_positions: openPositions, 
                        profit_orders: pOrders, loss_orders: lOrders,
                        profit_today: pToday, profit_week: pWeek, profit_month: pMonth,
                        lastUpdated: latest.lastUpdated, error: false 
                    };
                }

                updatePortfolioSummary();
                updateUICard(login);
                updateTreeRanks();
            } catch (err) {
                globalPortfolioData[login] = { error: true };
                updateUICard(login);
                updateTreeRanks();
            }
        }

        const formatMoney = (val) => {
            const absVal = Math.abs(val).toFixed(2);
            if (val > 0) return `+$${absVal}`;
            if (val < 0) return `-$${absVal}`;
            return `$${absVal}`;
        };

        const formatPercent = (val) => {
            const absVal = Math.abs(val).toFixed(2);
            if (val > 0) return `(+${absVal}%)`;
            if (val < 0) return `(-${absVal}%)`;
            return `(0.00%)`;
        };

        const getColorClass = (val) => val > 0 ? 'positive' : (val < 0 ? 'negative' : '');

        function updateUICard(login) {
            const data = globalPortfolioData[login];
            if (!data) return;

            const statusDiv = document.getElementById(`status-${login}`);
            const weatherBadge = document.getElementById(`weather-badge-${login}`);
            const balDiv = document.getElementById(`bal-${login}`);
            const eqDiv = document.getElementById(`eq-${login}`);
            const plDiv = document.getElementById(`pl-${login}`);
            const ordDiv = document.getElementById(`ord-${login}`);
            const timeDiv = document.getElementById(`time-${login}`);
            
            const todayDiv = document.getElementById(`today-${login}`);
            const weekDiv = document.getElementById(`week-${login}`);
            const monthDiv = document.getElementById(`month-${login}`);
            
            if (!statusDiv) return;

            if (data.error) {
                statusDiv.innerHTML = '<span class="status-dot"></span> ขาดการติดต่อ';
                statusDiv.style.color = 'var(--danger-red)';
                weatherBadge.innerHTML = '<span>⚠️</span> ข้อมูลขาดหาย';
                weatherBadge.style.color = 'var(--danger-red)';
                weatherBadge.style.borderColor = 'rgba(248, 113, 113, 0.4)';
                return;
            }

            statusDiv.innerHTML = '<span class="status-dot"></span> ป่าไม้อุดมสมบูรณ์';
            statusDiv.style.color = 'var(--leaf-green)';
            weatherBadge.style.color = 'var(--leaf-green)';
            weatherBadge.style.borderColor = 'rgba(52, 211, 153, 0.4)';

            let weatherEmoji = ''; let weatherText = '';
            const percent = data.percent;
            
            if (data.open_positions === 0) {
                weatherEmoji = '🏕️'; weatherText = 'ตั้งแคมป์รอจังหวะ';
                weatherBadge.style.color = '#fbbf24'; weatherBadge.style.borderColor = 'rgba(251, 191, 36, 0.4)';
            } else if (percent > 15) { weatherEmoji = '🌈'; weatherText = 'รุ้งงามทอประกาย';
            } else if (percent > 10) { weatherEmoji = '☀️'; weatherText = 'แดดออกอบอุ่น';
            } else if (percent > 5) { weatherEmoji = '🌤️'; weatherText = 'เมฆประดับบางส่วน';
            } else if (percent > 0) { weatherEmoji = '⛅'; weatherText = 'ร่มรื่น แดดอ่อนๆ';
            } else if (percent === 0) { weatherEmoji = '🌫️'; weatherText = 'สงบเงียบ';
            } else if (percent >= -5) { weatherEmoji = '🌧️'; weatherText = 'ฝนตกปรอยๆ';
            } else if (percent >= -10) { weatherEmoji = '☔'; weatherText = 'ฝนตกชุก'; weatherBadge.style.color = '#fbbf24'; weatherBadge.style.borderColor = 'rgba(251, 191, 36, 0.4)';
            } else if (percent >= -15) { weatherEmoji = '⛈️'; weatherText = 'พายุฝนรุนแรง!'; weatherBadge.style.color = 'var(--danger-red)'; weatherBadge.style.borderColor = 'rgba(248, 113, 113, 0.4)';
            } else { weatherEmoji = '🌪️'; weatherText = 'พายุทอร์นาโด!'; weatherBadge.style.color = 'var(--danger-red)'; weatherBadge.style.borderColor = 'rgba(248, 113, 113, 0.4)'; }

            weatherBadge.innerHTML = `<span>${weatherEmoji}</span> ${weatherText}`;
            balDiv.innerText = `$${data.initial.toFixed(2)}`;
            eqDiv.innerText = `$${data.equity.toFixed(2)}`;

            plDiv.className = `metric-value ${getColorClass(data.profit)}`;
            plDiv.innerText = `${formatMoney(data.profit)} ${formatPercent(percent)}`;

            ordDiv.innerHTML = `<span style="color:var(--leaf-green)">🟢 ${data.profit_orders}</span> | <span style="color:var(--danger-red)">🔴 ${data.loss_orders}</span>`;
            
            todayDiv.innerText = formatMoney(data.profit_today);
            todayDiv.className = `history-val ${getColorClass(data.profit_today)}`;
            
            weekDiv.innerText = formatMoney(data.profit_week);
            weekDiv.className = `history-val ${getColorClass(data.profit_week)}`;
            
            monthDiv.innerText = formatMoney(data.profit_month);
            monthDiv.className = `history-val ${getColorClass(data.profit_month)}`;

            timeDiv.innerText = new Date(data.lastUpdated).toLocaleTimeString('th-TH');
        }

        function updateTreeRanks() {
            const farms = Object.keys(globalPortfolioData).filter(f => !globalPortfolioData[f].error);
            if (farms.length === 0) return;

            let minEq = Infinity; let maxEq = -Infinity; let maxPercent = 0;
            farms.forEach(f => {
                const data = globalPortfolioData[f];
                if (data.open_positions >= 1) {
                    if (data.equity < minEq) minEq = data.equity;
                    if (data.equity > maxEq) maxEq = data.equity;
                }
                if (data.percent > maxPercent) maxPercent = data.percent;
            });

            if(minEq === Infinity) { minEq = 0; maxEq = 0; }

            farms.forEach(f => {
                const data = globalPortfolioData[f];
                const avatarContainer = document.getElementById(`avatar-container-${f}`);
                const tierDiv = document.getElementById(`tier-${f}`);
                const starsSpan = document.getElementById(`stars-${f}`);
                const weatherBadge = document.getElementById(`weather-badge-${f}`);
                
                if (!avatarContainer || !tierDiv) return;
                let badgeHTML = weatherBadge ? weatherBadge.outerHTML : '';

                if (data.open_positions === 0) {
                    avatarContainer.innerHTML = `<div class="tree-avatar">🏕️</div>` + badgeHTML;
                    tierDiv.innerText = 'แคมป์พักแรมรอออเดอร์';
                } else {
                    let level = 1;
                    if (maxEq > minEq) { level = Math.floor(((data.equity - minEq) / (maxEq - minEq)) * 9) + 1; } 
                    else { level = 10; }
                    if (data.balance <= 0) level = 0;

                    let treeEmoji = ''; let treeName = '';
                    switch(level) {
                        case 0: treeEmoji = '🌰'; treeName = 'เมล็ดพันธุ์ในดิน (Seed)'; break;
                        case 1: treeEmoji = '🌱'; treeName = 'ต้นกล้าแรกแย้ม (Level 1)'; break;
                        case 2: treeEmoji = '🪴'; treeName = 'ไม้ประดับกระถาง (Level 2)'; break;
                        case 3: treeEmoji = '🌿'; treeName = 'พุ่มไม้ใบอ่อน (Level 3)'; break;
                        case 4: treeEmoji = '☘️'; treeName = 'พุ่มไม้เขียวขจี (Level 4)'; break;
                        case 5: treeEmoji = '🎋'; treeName = 'กอไผ่ตั้งตรง (Level 5)'; break;
                        case 6: treeEmoji = '🌴'; treeName = 'ต้นปาล์มพลิ้วไหว (Level 6)'; break;
                        case 7: treeEmoji = '🌳'; treeName = 'ไม้ผลัดใบให้ร่มเงา (Level 7)'; break;
                        case 8: treeEmoji = '🌲'; treeName = 'ต้นสนสูงตระหง่าน (Level 8)'; break;
                        case 9: treeEmoji = '🌵'; treeName = 'พฤกษาแกร่งทนทาน (Level 9)'; break;
                        case 10: treeEmoji = '🪵'; treeName = 'มหาพฤกษาโบราณ (Level 10)'; break;
                    }
                    
                    let clusterHTML = `<div class="forest-cluster"><div class="tree-base">${treeEmoji}</div>`;
                    
                    let extraHealthy = 0;
                    if(data.percent >= 10) extraHealthy = Math.floor(data.percent / 10);
                    if(data.profit_orders > 0 && extraHealthy === 0) extraHealthy = 1;
                    if(extraHealthy > 3) extraHealthy = 3; 
                    
                    let extraWithered = Math.min(data.loss_orders, 2);

                    let pos = 1;
                    for(let i=0; i<extraHealthy; i++) {
                        clusterHTML += `<div class="tree-extra extra-${pos}">${treeEmoji}</div>`;
                        pos++;
                    }
                    for(let i=0; i<extraWithered; i++) {
                        clusterHTML += `<div class="tree-extra extra-${pos} withered">🥀</div>`;
                        pos++;
                    }

                    clusterHTML += `<span class="sparkle sparkle-1">✨</span><span class="sparkle sparkle-2">✨</span><span class="sparkle sparkle-3">✨</span></div>`;
                    avatarContainer.innerHTML = clusterHTML + badgeHTML;
                    tierDiv.innerText = treeName;
                }

                if (starsSpan) {
                    let starsCount = 0;
                    if (data.percent > 0 && maxPercent > 0 && data.open_positions > 0) {
                        starsCount = Math.ceil((data.percent / maxPercent) * 5);
                        if(starsCount < 1) starsCount = 1; if(starsCount > 5) starsCount = 5;
                    }
                    starsSpan.innerText = '⭐'.repeat(starsCount);
                }
            });
            autoSortForestCards();
        }

        function autoSortForestCards() {
            const grid = document.getElementById('forest-grid');
            const cards = Array.from(grid.getElementsByClassName('tree-card'));
            
            cards.sort((a, b) => {
                const loginA = a.getAttribute('data-login');
                const loginB = b.getAttribute('data-login');
                const percentA = (globalPortfolioData[loginA] && !globalPortfolioData[loginA].error && globalPortfolioData[loginA].percent !== undefined) 
                                 ? globalPortfolioData[loginA].percent : -999999;
                const percentB = (globalPortfolioData[loginB] && !globalPortfolioData[loginB].error && globalPortfolioData[loginB].percent !== undefined) 
                                 ? globalPortfolioData[loginB].percent : -999999;
                return percentB - percentA;
            });
            
            cards.forEach((card, index) => {
                card.style.order = index; 
                grid.appendChild(card);
            });
        }

        function updatePortfolioSummary() {
            let totalBalance = 0; let totalEquity = 0; let totalProfit = 0; let totalInitial = 0; let totalTrees = 0;
            const farms = getFarmsList();
            farms.forEach(login => {
                const data = globalPortfolioData[login];
                if (data && !data.error) {
                    totalBalance += data.balance || 0; totalEquity += data.equity || 0;
                    totalProfit += data.profit || 0; totalInitial += data.initial || 0;
                    totalTrees += data.open_positions || 0;
                }
            });
            document.getElementById('sum-balance').innerText = `$${totalBalance.toFixed(2)}`;
            document.getElementById('sum-equity').innerText = `$${totalEquity.toFixed(2)}`;
            
            const plElem = document.getElementById('sum-pl');
            plElem.className = 'summary-val ' + getColorClass(totalProfit);
            plElem.innerText = formatMoney(totalProfit);

            const totalPercent = (totalInitial > 0) ? (totalProfit / totalInitial) * 100 : 0;
            const percentElem = document.getElementById('sum-percent');
            percentElem.className = 'summary-val ' + getColorClass(totalPercent);
            percentElem.innerText = (totalPercent > 0 ? '+' : '') + totalPercent.toFixed(2) + '%';

            document.getElementById('sum-farms').innerText = `${farms.length} แปลง`;
            document.getElementById('sum-trees').innerText = `${totalTrees} ต้น`;
        }
    </script>
</body>
</html>
