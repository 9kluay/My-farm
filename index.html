<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ป่าไม้แห่งการลงทุน - Multi-User Living Forest</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --forest-dark: #071911;
            --forest-card: rgba(14, 38, 26, 0.85);
            --forest-border: rgba(52, 211, 153, 0.25);
            --leaf-green: #34d399;
            --leaf-glow: rgba(52, 211, 153, 0.4);
            --text-light: #ecfdf5;
            --text-dim: #9ca3af;
            --danger-red: #f87171;
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--forest-dark);
            background-image: 
                radial-gradient(circle at 20% 10%, rgba(16, 185, 129, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 80% 90%, rgba(5, 150, 105, 0.12) 0%, transparent 40%);
            color: var(--text-light);
            margin: 0; padding: 40px 20px 100px 20px;
            min-height: 100vh;
        }

        .river-container {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 50px;
            background: linear-gradient(180deg, rgba(4, 47, 46, 0.4) 0%, rgba(2, 44, 34, 0.95) 100%);
            border-top: 2px solid rgba(52, 211, 153, 0.3); z-index: 999;
            display: flex; align-items: center; overflow: hidden;
        }

        .river-wave-track {
            display: flex; white-space: nowrap;
            animation: flowRiver 12s linear infinite;
        }

        .river-wave-item {
            font-size: 16px; color: #6ee7b7; padding-right: 40px;
        }

        @keyframes flowRiver { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        .falling-leaf {
            position: fixed; top: -50px; font-size: 20px; z-index: 1; pointer-events: none;
            animation: fallLeaf linear infinite;
        }
        @keyframes fallLeaf {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.9; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(7, 25, 17, 0.97); backdrop-filter: blur(25px);
            display: flex; justify-content: center; align-items: center; z-index: 99999;
        }

        .auth-box {
            background: var(--forest-card); border: 1px solid var(--forest-border);
            padding: 40px; border-radius: 30px; text-align: center;
            max-width: 420px; width: 90%; animation: floatLock 4s ease-in-out infinite;
        }
        @keyframes floatLock { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        .auth-input {
            background: rgba(6, 23, 15, 0.9); border: 1px solid rgba(52, 211, 153, 0.3);
            padding: 14px 20px; border-radius: 16px; color: white; width: 100%; margin-bottom: 15px;
        }
        .auth-input:focus { border-color: var(--leaf-green); outline: none; }

        .tab-switch { display: flex; background: rgba(6, 23, 15, 0.6); border-radius: 12px; padding: 4px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; background: transparent; border: none; color: var(--text-dim); cursor: pointer; }
        .tab-btn.active { background: var(--leaf-green); color: #064e3b; border-radius: 10px; }

        .container { max-width: 1400px; margin: 0 auto; z-index: 10; position: relative; }
        
        .user-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--forest-card); padding: 12px 25px; border-radius: 20px; margin-bottom: 30px;
        }
        
        header h1 { font-size: 44px; margin: 0 0 10px 0; color: #6ee7b7; text-align: center; }
        header p { color: var(--text-dim); text-align: center; margin-bottom: 40px; }

        .control-box {
            background: var(--forest-card); padding: 18px 28px; border-radius: 24px;
            display: inline-flex; gap: 15px; margin-bottom: 45px; justify-content: center;
        }
        
        .btn { padding: 14px 28px; border-radius: 16px; border: none; cursor: pointer; color: white; font-weight: 600; }
        .btn-plant { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .btn-water { background: rgba(255, 255, 255, 0.1); }
        .btn-logout { background: var(--danger-red); padding: 8px 16px; }

        #forest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 30px; }
        .tree-card { background: var(--forest-card); border: 1px solid var(--forest-border); border-radius: 30px; padding: 30px; }
        .nature-pod { text-align: center; margin-bottom: 25px; }
        .tree-avatar { font-size: 80px; margin-bottom: 12px; }
        .metrics-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .metric-card { background: rgba(6, 23, 15, 0.5); padding: 14px 16px; border-radius: 16px; }
        .metric-value { font-size: 16px; font-weight: 700; color: #fff; }
    </style>
</head>
<body>

    <div class="river-container"><div class="river-wave-track" id="riverTrack"></div></div>

    <div id="auth-screen">
        <div class="auth-box">
            <h2 style="color:white;">🌲 Living Forest</h2>
            <div class="tab-switch">
                <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">เข้าสู่ระบบ</button>
                <button class="tab-btn" id="tab-register" onclick="switchTab('register')">สมัครสมาชิก</button>
            </div>
            <input type="text" id="usernameInput" class="auth-input" placeholder="Username">
            <input type="password" id="passwordInput" class="auth-input" placeholder="Password">
            <button class="btn btn-plant" style="width: 100%;" onclick="handleAuth()">เข้าสู่ระบบ</button>
        </div>
    </div>

    <div class="container">
        <div class="user-bar">
            <div style="color:var(--leaf-green);">🌲 Living MT4 Forest</div>
            <div>
                <span id="welcomeUser" style="color: white; margin-right: 15px;"></span>
                <button class="btn btn-logout" onclick="logoutUser()">ออก</button>
            </div>
        </div>

        <header>
            <h1>ป่าไม้แห่งการลงทุน</h1>
            <p>จำลองสภาพอากาศเคลื่อนไหวเฉพาะพอร์ตของคุณ</p>
        </header>

        <div style="text-align: center;">
            <div class="control-box">
                <input type="text" id="loginId" class="auth-input" style="width:250px; margin:0;" placeholder="เลขพอร์ต MT4...">
                <button class="btn btn-plant" onclick="addFarm()">🌲 ปลูก</button>
                <button class="btn btn-water" onclick="refreshAll()">💧 รดน้ำ</button>
            </div>
        </div>

        <div id="forest-grid"></div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzVJpGjKYIEUMvP4lrfeauE0ylJXtOaXndxxjXHfW3R0C6RYZ9mClszxEUA-3IRoHKApg/exec';
        let currentMode = 'login';
        let currentUser = sessionStorage.getItem('forest_current_user') || null;

        window.onload = () => {
            initRiver(); startWindEffect();
            if (currentUser) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('welcomeUser').innerText = `👤 ${currentUser}`;
                fetchUserFarmsFromCloud().then(() => { renderForest(); refreshAll(); });
            }
        };

        function initRiver() {
            document.getElementById('riverTrack').innerHTML = '<div class="river-wave-item">🌊 💧 🌿 สายน้ำแห่งสภาพคล่อง 🌿 💧 🌊</div>'.repeat(6);
        }

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-register').classList.toggle('active', mode === 'register');
        }

        async function handleAuth() {
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            if (!user || !pass) return alert('กรุณากรอกข้อมูลให้ครบ');

            const res = await fetch(SCRIPT_URL, {
                method: 'POST', body: JSON.stringify({ action: currentMode, user, pass })
            });
            const data = await res.json();

            if (!data.success) return alert(data.message || 'ผิดพลาด');
            
            sessionStorage.setItem('forest_current_user', user);
            currentUser = user;
            if (data.farms) localStorage.setItem(`farms_${user}`, JSON.stringify(data.farms));
            
            location.reload();
        }

        function logoutUser() {
            sessionStorage.removeItem('forest_current_user');
            location.reload();
        }

        function getFarmsList() { return JSON.parse(localStorage.getItem(`farms_${currentUser}`) || '[]'); }
        function saveFarmsList(f) { localStorage.setItem(`farms_${currentUser}`, JSON.stringify(f)); }

        async function fetchUserFarmsFromCloud() {
            if (!currentUser) return;
            const res = await fetch(`${SCRIPT_URL}?action=getUserData&user=${currentUser}`);
            const data = await res.json();
            if (data.success && data.farms) saveFarmsList(data.farms);
        }

        async function syncFarmsToCloud(farms) {
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'updateFarms', user: currentUser, farms }) });
        }

        function addFarm() {
            const login = document.getElementById('loginId').value.trim();
            if (!login) return;
            let farms = getFarmsList();
            if (!farms.includes(login)) {
                farms.push(login); saveFarmsList(farms); syncFarmsToCloud(farms);
                renderForest(); fetchNodeData(login);
            }
            document.getElementById('loginId').value = '';
        }

        window.removeFarm = function(login) {
            let farms = getFarmsList().filter(f => f !== login);
            saveFarmsList(farms); syncFarmsToCloud(farms); renderForest();
        };

        function renderForest() {
            const grid = document.getElementById('forest-grid');
            const farms = getFarmsList();
            grid.innerHTML = '';
            
            if(!farms.length) { grid.innerHTML = '<div style="color:white;text-align:center;width:100%;">ป่ายังว่างเปล่า เพิ่มพอร์ตด้านบน</div>'; return; }

            farms.forEach(login => {
                grid.innerHTML += `
                    <div class="tree-card">
                        <div style="display:flex; justify-content:space-between; color:white; margin-bottom:15px;">
                            <h3 style="margin:0;">🌲 #${login}</h3>
                            <button onclick="removeFarm('${login}')" style="background:red; color:white; border:none; border-radius:5px; padding:5px 10px; cursor:pointer;">✕</button>
                        </div>
                        <div class="nature-pod">
                            <div class="tree-avatar" id="avatar-${login}">🌱</div>
                            <div id="weather-${login}" style="color:#6ee7b7;">กำลังโหลด...</div>
                        </div>
                        <div class="metrics-container">
                            <div class="metric-card"><div style="color:gray;font-size:12px;">Balance</div><div id="bal-${login}">$0</div></div>
                            <div class="metric-card"><div style="color:gray;font-size:12px;">Equity</div><div id="eq-${login}">$0</div></div>
                            <div class="metric-card"><div style="color:gray;font-size:12px;">P/L</div><div id="pl-${login}">$0</div></div>
                            <div class="metric-card"><div style="color:gray;font-size:12px;">Orders</div><div id="ord-${login}">0</div></div>
                        </div>
                    </div>`;
            });
        }

        async function fetchNodeData(login) {
            try {
                const res = await fetch(`${SCRIPT_URL}?login=${login}`);
                const data = await res.json();
                if (data.error || !data.length) return;
                
                const latest = data[0];
                document.getElementById(`bal-${login}`).innerText = `$${latest.balance}`;
                document.getElementById(`eq-${login}`).innerText = `$${latest.equity}`;
                document.getElementById(`pl-${login}`).innerText = `$${latest.floating_pl}`;
                document.getElementById(`ord-${login}`).innerText = latest.open_positions;
                
                let emoji = latest.equity > 10000 ? '🌲' : (latest.equity > 1000 ? '🌳' : '🌱');
                document.getElementById(`avatar-${login}`).innerText = emoji;
                document.getElementById(`weather-${login}`).innerText = latest.floating_pl >= 0 ? '☀️ แดดออก' : '🌧️ ฝนตก';
            } catch(e) {}
        }

        function refreshAll() { fetchUserFarmsFromCloud().then(() => getFarmsList().forEach(fetchNodeData)); }

        function startWindEffect() {
            setInterval(() => {
                const leaf = document.createElement('div');
                leaf.className = 'falling-leaf'; leaf.innerText = '🍃';
                leaf.style.left = Math.random() * window.innerWidth + 'px';
                leaf.style.animationDuration = (Math.random() * 5 + 4) + 's';
                document.body.appendChild(leaf); setTimeout(() => leaf.remove(), 9000);
            }, 1500);
        }
    </script>
</body>
</html>
